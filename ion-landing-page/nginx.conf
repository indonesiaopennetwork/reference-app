server {
    listen 80;

    # Written by env.sh at container start, outside /usr/share/nginx/html --
    # that path is a read-only GCS bucket mount in the cloud (see
    # terraform/cloud-run-ion-landing-page.tf), so env.sh can't write into it.
    location = /env-config.js {
        root /usr/share/nginx/env-config-out;
    }

    # Static page, no API calls of its own -- everything falls back to
    # index.html (there's nothing else to serve at any path here).
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
