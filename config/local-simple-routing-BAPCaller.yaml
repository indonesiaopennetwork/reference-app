routingRules:
  - version: "2.0.0"
    targetType: "bpp"
    endpoints:
      - select
      - init
      - confirm
      - status
      - cancel
      - update
      - rate
      - support
      - on_reconcile
      - reconcile
  - version: "2.0.0"
    targetType: "url"
    target:
      # mock-cds (scripts/mock-cds.py): ACKs the discover, then sends
      # on_discover to the request's bapUri, signed as the BAP. It answers
      # from the *.latest.json.gz catalog files on disk, skipping paused,
      # retired and schema-invalid ones (see its skip_reason). For the real
      # crawler use discovery-service instead: url "http://discovery-service:8087"
      # -- its TRUSTED_CALLER_KEY_ID/TRUSTED_CALLER_PUBLIC_KEY_BASE64
      # (docker-compose.yml) already trust onix-bap's signing key.
      url: "http://mock-cds:8086"
    endpoints:
      - discover
