routingRules:
  - version: "2.0.0"
    targetType: "bpp"
    endpoints:
      - select
      - init
      - confirm
      - status
      - cancel
      - update
      - rate
      - support
      - on_reconcile
      - reconcile
  - version: "2.0.0"
    targetType: "url"
    target:
      # mock-cds (scripts/mock-cds.py): ACKs the discover, then sends
      # on_discover to the request's bapUri, signed as the BAP. It answers
      # from every *.latest.json.gz catalog file on disk with no lifecycle
      # awareness, so retired or paused catalogs still show up in search.
      # For the real crawler (retiredAt tombstones, isActive pause/resume)
      # use discovery-service instead: url "http://discovery-service:8087"
      # -- its TRUSTED_CALLER_KEY_ID/TRUSTED_CALLER_PUBLIC_KEY_BASE64
      # (docker-compose.yml) already trust onix-bap's signing key.
      url: "http://mock-cds:8086"
    endpoints:
      - discover
