# Bundled from ion-specs releases/release1/schema/core/api/v2.0.0/ion-additional.yaml
# by scripts/bundle_ion_pack.py: components of other ION packs are
# inlined from the local ion-specs tree; vendored Beckn refs stay remote.
# Do not edit by hand; re-run the script (see schemas/README.md).
openapi: 3.1.1
info:
  title: ION Additional API
  version: 1.0.0
  description: "ION network endpoints that Beckn Protocol v2.0.0 does not define. This file holds every\
    \ such endpoint in Release 1; new ION endpoints are added here rather than in separate files.\n\n\
    This file extends Beckn; it does not copy or embed it. Every Beckn type is referenced from the Release\
    \ 1 vendored upstream Beckn contract at https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml.\
    \ Validate this file together with that contract; do not merge them.\n\n## Settlement reconciliation\
    \ (`/reconcile`, `/on_reconcile`)\n\nSettlement reconciliation runs between the two network participants\
    \ of an order: the Consumer Node (BAP) and the Provider Node (BPP).\n\nION has no separate settle\
    \ or report API. Reconciliation, agreement, and the payout trigger are all carried by `/reconcile`\
    \ and `/on_reconcile`:\n1. Either participant (BAP or BPP) sends `/reconcile` with the contracts\n\
    \   whose settlements fall due on `settlementDate`. Each contract is a\n   Beckn `Contract`; the sender's\
    \ figures are in its\n   `settlements[].settlementAttributes` as `IONSettlementReconciliation`\n \
    \  (defined by the common/Settlement/v1 attribute pack). Each settlement\n   states its own `orderDate`\
    \ and `dueDate`.\n\n2. The counterparty answers with `/on_reconcile`, setting `accord` on\n   every\
    \ settlement. `accord: true` means both participants agree on that\n   settlement's entitlements:\
    \ the BAP's `commission` and the BPP's\n   `netPayable`. `accord: false` carries the counterparty's\
    \ own figures,\n   the per-component `diffValue` (its value minus the value it answers),\n   and a\
    \ `dispute` code that makes the settlement disputed or, for\n   `SETTLEMENT_WINDOW_NOT_REACHED` and\
    \ `AWAITING_INFORMATION`, pending.\n\n3. Agreement is per settlement. An agreed settlement stays agreed\
    \ and\n   goes on to SEAM whatever happens to the others in the batch.\n   `reconciliationStatus`\
    \ only summarizes the answer: `AGREED` when every\n   settlement is agreed, `DISPUTED` when any is\
    \ disputed, and otherwise\n   `PENDING`. The sender then sends only the disputed and pending\n   settlements\
    \ again, in a new `/reconcile` with the same\n   `context.transactionId` and a new `context.messageId`,\
    \ corrected or\n   once due.\n\n4. `accord: true` is not a payout instruction. SEAM (Settlement\n\
    \   Assurance Mechanism) separately verifies the funds, the accounts in\n   `settlementAccounts` and\
    \ that nothing is paid twice before it has an\n   agreed settlement paid: `netPayable` to the BPP,\
    \ or to the recipients\n   the BPP splits it among, and `commission` to the BAP. A prepaid\n   buyer\
    \ payment is held at the PJP (Penyelenggara Jasa Pembayaran);\n   `collections` records cash-on-delivery,\
    \ credit and transfer\n   collections. Payout status reaches the participants through the\n   PJP's\
    \ webhook, which is outside this specification.\n\n\nA reconciliation exchange is identified by `context.transactionId`\
    \ and each request–callback pair by `context.messageId`; there is no separate reconciliation ID. Unlike\
    \ a Beckn order flow, where the BAP starts the transaction, either participant may start a reconciliation\
    \ exchange and create its `transactionId`. A plain retransmission repeats the same `messageId` and\
    \ is processed once. The economic identity of a settlement is the BAP–BPP pair with `Contract.id`\
    \ and `Settlement.id`; an agreed settlement is never paid twice, whichever message repeats it. A later\
    \ correction is a new settlement with its own `Settlement.id` and `relatedSettlementId`.\n\n`IONSettlementReconciliation`\
    \ is the order's payment settlement from `init` on: the participants' bank accounts (`settlementAccounts`)\
    \ are agreed on it in `init` and `on_init`, and reconciliation sends the same object with each participant's\
    \ figures. The settlement terms come from the offers: the payout terms from each offer's `policies.settlement`\
    \ (`IONTradeOffer`) and the commission from the buyer finder fee on each offer's consideration (`IONTradeConsideration.buyerFinderFee`),\
    \ whose total for the order is the contract consideration's `buyerFinderFee.feeAmount`.\n\nA contract\
    \ in these messages is a snapshot that carries reconciliation figures. It does not update the contract:\
    \ `commitments` are included only because Beckn requires them, and receivers MUST NOT treat them as\
    \ a change.\n\nBeckn v2.0 terminology applies: Consumer Node (CN) replaces BAP and Provider Node (PN)\
    \ replaces BPP; the wire-level fields `bapId` and `bppId` are retained.\n"
  contact:
    name: ION Network
    url: https://schema.ion.id
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{subscriberUrl}
  description: Base URL of the receiving network participant (resolved via the registry).
  variables:
    subscriberUrl:
      default: example.beckn.io
security: []
tags:
- name: Post-Fulfillment
  description: Settlement reconciliation between the BAP and BPP of an order.
paths:
  /reconcile:
    post:
      summary: A participant submits its settlement figures for the due contracts
      operationId: reconcile
      tags:
      - Post-Fulfillment
      description: 'Sent by either participant of an order (BAP or BPP) to its counterparty, normally
        once per settlement date, listing the contracts between them whose settlements fall due on that
        date, with the sender''s figures for each. Settlements left disputed or pending are sent again,
        alone, in a new `/reconcile` with the same `context.transactionId` and a new `context.messageId`.


        `context.bapId` and `context.bppId` are always the BAP and BPP of the original orders, whoever
        sends. `context.senderId` and `context.receiverId` identify the actual sender and receiver. `context.transactionId`
        identifies the reconciliation exchange; it is not any one contract''s transactionId, and the sender
        creates it whether it is the BAP or the BPP.


        Callback relationship: the receiver MUST answer with `/on_reconcile` correlated by `context.messageId`.

        '
      parameters:
      - $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/parameters/AuthorizationHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  description: 'The Beckn context. bapId and bppId are the BAP and BPP of the original
                    orders, whoever sends; senderId and receiverId are the actual sender and receiver.

                    '
                  allOf:
                  - $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Context
                  - type: object
                    properties:
                      action:
                        description: Always reconcile.
                        type: string
                        const: reconcile
                message:
                  description: 'The sender''s figures for the contracts whose settlements fall due on
                    settlementDate.

                    '
                  $ref: '#/components/schemas/ReconcileAction'
      responses:
        '200':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/Ack
        '400':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackBadRequest
        '401':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackUnauthorized
        '500':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/ServerError
  /on_reconcile:
    post:
      summary: The counterparty agrees or disagrees with each contract's figures
      operationId: on_reconcile
      tags:
      - Post-Fulfillment
      description: 'Sent by the receiver of `/reconcile` back to its sender, with the same `context.transactionId`
        and `context.messageId`. It answers every settlement in the request and no other. On each settlement
        it sets `accord`; one with `accord: false` carries the counterparty''s own figures, a `diffValue`
        on each differing component, and a `dispute` code. Agreed settlements go on to SEAM; the sender
        sends the disputed and pending ones again in a new `/reconcile`. Signed as a Beckn callback, whichever
        participant answers.

        '
      parameters:
      - $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/parameters/CallbackAuthorizationHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  description: 'The Beckn context. bapId and bppId are the BAP and BPP of the original
                    orders, whoever sends; senderId and receiverId are the actual sender and receiver.

                    '
                  allOf:
                  - $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Context
                  - type: object
                    properties:
                      action:
                        description: Always on_reconcile.
                        type: string
                        const: on_reconcile
                message:
                  description: 'The counterparty''s figures and accord for every settlement in the /reconcile
                    being answered.

                    '
                  $ref: '#/components/schemas/OnReconcileAction'
      responses:
        '200':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/Ack
        '400':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackBadRequest
        '401':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackUnauthorized
        '500':
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/ServerError
components:
  schemas:
    ReconcileAction:
      title: Reconcile Action
      description: 'The sender''s reconciliation figures for one settlement date against one counterparty:
        the contracts to reconcile and their totals.

        '
      type: object
      additionalProperties: false
      required:
      - settlementDate
      - contracts
      - settlementSummary
      properties:
        settlementDate:
          type: string
          format: date
          description: 'The business date of this reconciliation run, whose due settlements it carries.
            Each settlement''s own orderDate and dueDate are in its settlementAttributes.

            '
        contracts:
          type: array
          minItems: 1
          description: 'The contracts to reconcile, each carrying the sender''s figures on its settlements.
            A Contract.id appears once, and a Settlement.id once within its contract.

            '
          items:
            $ref: '#/components/schemas/ReconcileContract'
        settlementSummary:
          description: 'The sender''s totals over its own figures for the settlements in this message.

            '
          $ref: '#/components/schemas/SettlementSummary'
    OnReconcileAction:
      title: On Reconcile Action
      description: 'The counterparty''s answer to a /reconcile: its figures and accord for every settlement
        in it.

        '
      type: object
      additionalProperties: false
      required:
      - settlementDate
      - reconciliationStatus
      - contracts
      - settlementSummary
      properties:
        settlementDate:
          type: string
          format: date
          description: The settlementDate of the /reconcile being answered.
        reconciliationStatus:
          type: string
          enum:
          - AGREED
          - DISPUTED
          - PENDING
          description: 'Summary of the answer; it does not override any settlement''s accord. AGREED —
            every settlement has accord true. DISPUTED — at least one is disputed (accord false with a
            disputed code). PENDING — none is disputed, and at least one is pending (SETTLEMENT_WINDOW_NOT_REACHED
            or AWAITING_INFORMATION). Agreed settlements go on to SEAM in every case.

            '
        contracts:
          type: array
          minItems: 1
          description: 'The counterparty''s figures and accord for every contract and settlement in the
            /reconcile, and no others.

            '
          items:
            $ref: '#/components/schemas/OnReconcileContract'
        settlementSummary:
          description: 'The counterparty''s totals over its own figures, with the outcome counts and the
            agreed and unreconciled entitlements.

            '
          allOf:
          - $ref: '#/components/schemas/SettlementSummary'
          - required:
            - agreedCount
            - disputedCount
            - pendingCount
            - totalAgreedCommission
            - totalUnreconciledCommission
            - totalAgreedNetPayable
            - totalUnreconciledNetPayable
    ReconcileContract:
      title: Reconcile Contract
      description: 'A Beckn Contract snapshot whose settlements carry reconciliation figures. id identifies
        the contract; each settlement''s id identifies a settlement obligation, prepaid or not.

        '
      allOf:
      - $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract
      - type: object
        required:
        - id
        - settlements
        properties:
          id:
            description: The contract's Contract.id from the order flow.
            $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract/properties/id
          settlements:
            description: 'The contract''s settlements to reconcile, each with the sender''s figures. A
              Settlement.id appears once.

              '
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/ReconcileSettlement'
    ReconcileSettlement:
      title: Reconcile Settlement
      description: A settlement with the sender's figures.
      type: object
      required:
      - id
      - settlementAttributes
      properties:
        id:
          description: 'The settlement''s Settlement.id, which identifies one settlement obligation of
            the contract.

            '
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Settlement/properties/id
        settlementAttributes:
          description: The sender's figures for the settlement.
          $ref: '#/components/schemas/IONSettlementReconciliation'
    OnReconcileContract:
      title: On Reconcile Contract
      description: A ReconcileContract whose settlements carry the counterparty's figures and accord.
      allOf:
      - $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract
      - type: object
        required:
        - id
        - settlements
        properties:
          id:
            description: The Contract.id of the contract being answered.
            $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract/properties/id
          settlements:
            description: 'Every settlement of this contract in the /reconcile being answered, with the
              counterparty''s figures and accord, and no others.

              '
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/OnReconcileSettlement'
    OnReconcileSettlement:
      title: On Reconcile Settlement
      description: 'A settlement with the counterparty''s figures and its accord; dispute is required
        when accord is false, dueDate when it is true.

        '
      type: object
      required:
      - id
      - settlementAttributes
      properties:
        id:
          description: The Settlement.id of the settlement being answered.
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Settlement/properties/id
        settlementAttributes:
          description: 'The counterparty''s figures for the settlement, with its accord, which is required.

            '
          allOf:
          - $ref: '#/components/schemas/IONSettlementReconciliation'
          - type: object
            required:
            - accord
    SettlementSummary:
      title: Settlement Summary
      description: 'Totals over the settlements in the message, for cross-checking, from the sending participant''s
        own figures. Payouts are per settlement; there is no batch-level payable. The outcome counts and
        agreed and unreconciled totals appear only in /on_reconcile.

        '
      type: object
      additionalProperties: false
      required:
      - bapId
      - bppId
      - currency
      - settlementDate
      - contractCount
      - totalOrderAmount
      - totalCommission
      - totalWithholding
      - totalRefund
      - totalNetPayable
      properties:
        bapId:
          description: The BAP of the contracts reconciled; equal to context.bapId.
          type: string
        bppId:
          description: The BPP of the contracts reconciled; equal to context.bppId.
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 code; IDR for domestic ION trade. Every settlement in the message uses
            it.
        settlementDate:
          description: Equal to the message's settlementDate.
          type: string
          format: date
        contractCount:
          description: Number of contracts in the message.
          type: integer
          minimum: 1
        settlementCount:
          type: integer
          minimum: 1
          description: Number of settlements in the message.
        agreedCount:
          type: integer
          minimum: 0
          description: '/on_reconcile only: contracts whose settlements all have accord true. agreedCount
            + disputedCount + pendingCount = contractCount.

            '
        disputedCount:
          type: integer
          minimum: 0
          description: /on_reconcile only — contracts with at least one disputed settlement.
        pendingCount:
          type: integer
          minimum: 0
          description: '/on_reconcile only: contracts with no disputed settlement and at least one pending
            one.

            '
        agreedSettlementCount:
          type: integer
          minimum: 0
          description: '/on_reconcile only, optional: settlements with accord true. With the disputed
            and pending settlement counts it adds up to settlementCount.

            '
        disputedSettlementCount:
          type: integer
          minimum: 0
          description: /on_reconcile only, optional — disputed settlements.
        pendingSettlementCount:
          type: integer
          minimum: 0
          description: /on_reconcile only, optional — pending settlements.
        totalOrderAmount:
          type: number
          description: Sum of orderAmount.value over the message's settlements.
        totalCommission:
          type: number
          description: Sum of commission.value — the BAP's entitlement.
        totalWithholding:
          type: number
          description: Sum of withholdingAmount.value.
        totalRefund:
          type: number
          description: Sum of refundAmount.value.
        totalNetPayable:
          type: number
          description: Sum of netPayable.value — the BPP's entitlement.
        totalAgreedCommission:
          type: number
          minimum: 0
          description: /on_reconcile only — sum of commission.value over the settlements with accord true.
        totalUnreconciledCommission:
          type: number
          minimum: 0
          description: '/on_reconcile only: sum of the counterparty''s commission.value over the settlements
            with accord false. Its own claim, not an agreed amount.

            '
        totalAgreedNetPayable:
          type: number
          minimum: 0
          description: /on_reconcile only — sum of netPayable.value over the settlements with accord true.
        totalUnreconciledNetPayable:
          type: number
          minimum: 0
          description: '/on_reconcile only: sum of the counterparty''s netPayable.value over the settlements
            with accord false. Its own claim, not an agreed amount.

            '
        orderDayCounts:
          type: array
          description: 'Optional, informational: for each order day the message touches, the sending participant''s
            own count of the pair''s orders created that day, including those not yet due. The two participants''
            counts may differ; a difference is for them to investigate.

            '
          items:
            $ref: '#/components/schemas/OrderDayCount'
    OrderDayCount:
      title: Order Day Count
      description: One order day's counts, from the sending participant's own records.
      type: object
      additionalProperties: false
      required:
      - orderDate
      - reportedOrderCount
      properties:
        orderDate:
          type: string
          format: date
          description: Order creation date in Asia/Jakarta time.
        reportedOrderCount:
          type: integer
          minimum: 0
          description: Orders between the BAP and BPP created on orderDate.
        remainingOrderCount:
          type: integer
          minimum: 0
          description: 'Of those, orders not yet fully reconciled: not due, pending, disputed or not yet
            sent.

            '
    IONSettlementReconciliation:
      type: object
      title: IONSettlementReconciliation
      description: 'The order''s settlement, carried as one object from init to reconciliation. The BAP
        declares it in init (its payout account, payment method, status PENDING, and estimated figures);
        the BPP answers in on_init (its payout account, and the figures on its final price, with commission
        equal to the contract consideration''s buyerFinderFee.feeAmount); the BAP records the payment
        in confirm (status PAID, paidAt, gatewayRef, orderAmount = amount paid); the BPP keeps the figures
        current in on_cancel and on_update; and each participant sends its figures in /reconcile and /on_reconcile.
        Before reconciliation the figures are estimates. The figures are each participant''s own calculation
        of the two network participants'' entitlements: commission is the BAP''s and netPayable the BPP''s.
        Without ADDITIONAL breakup entries, orderAmount.value = netPayable.value + commission.value +
        withholdingAmount.value + refundAmount.value; each ADDITIONAL entry''s effectOnNetPayable adds
        to netPayable. A prepaid buyer payment is held at the PJP; collections records who collected the
        money when it is not (cash on delivery, credit, transfer). Agreement (accord) is per settlement
        and covers only these entitlements: SEAM separately verifies the funds and the accounts before
        it has any amount paid out, netPayable to the BPP (or the BPP''s recipients in settlementAccounts),
        commission to the BAP, refundAmount to the buyer, with withholdingAmount kept back. The payment
        fields reuse the IONPayment definitions. The payout falls due as the commitments'' offers state
        in policies.settlement (IONTradeOffer); with several offers, the one giving the latest due date
        applies. Earlier versions carried settlementBasis, settlementWindow and finderFee here; orders
        that still carry them remain valid (additionalProperties is true), but new settlements omit them.

        '
      x-ion-layer: ion
      x-recommended-parent: Settlement.settlementAttributes
      additionalProperties: true
      x-jsonld:
        '@context': https://schema.ion.id/release1/schema/common/Settlement/v1/context.jsonld
        '@type': ion:IONSettlementReconciliation
      x-beckn-attaches-to: Settlement.settlementAttributes
      required:
      - currency
      - orderAmount
      - commission
      - netPayable
      - settlementAccounts
      allOf:
      - if:
          properties:
            commission:
              properties:
                value:
                  exclusiveMinimum: 0
              required:
              - value
          required:
          - commission
        then:
          properties:
            settlementAccounts:
              contains:
                type: object
                properties:
                  holderRole:
                    const: BAP
                required:
                - holderRole
      - if:
          properties:
            accord:
              const: true
          required:
          - accord
        then:
          required:
          - dueDate
      - if:
          properties:
            accord:
              const: false
          required:
          - accord
        then:
          required:
          - dispute
      - if:
          properties:
            status:
              const: PENDING
          required:
          - status
        else:
          properties:
            settlementAccounts:
              contains:
                type: object
                anyOf:
                - properties:
                    holderRole:
                      const: BPP
                  required:
                  - holderRole
                - properties:
                    allocationFor:
                      const: BPP
                  required:
                  - allocationFor
      - if:
          properties:
            status:
              const: PAID
          required:
          - status
        then:
          required:
          - paidAt
      dependentRequired:
        adjustmentType:
        - relatedSettlementId
      properties:
        collectedBy:
          type: string
          enum:
          - BAP
          - BPP
          - LSP
          description: Which network participant collects payment from consumer.
        currency:
          type: string
          const: IDR
          default: IDR
        settlementAccounts:
          allOf:
          - type: array
            description: 'Bank accounts that receive this contract''s settlement payout. The BAP declares
              its account (for the commission) in init; the BPP declares its account (for the order proceeds)
              in on_init and echoes the BAP''s. The BPP may add the accounts of the sellers, logistics
              providers and other recipients it splits its share among (SettlementAccount.allocatedAmount).
              Reconciliation passes them to SEAM, which verifies them before any payout.

              '
            items:
              $ref: '#/components/schemas/SettlementAccount'
          minItems: 1
          description: 'Payout accounts: the BAP declares its account in init, the BPP adds its own in
            on_init, and the BPP may add the recipients it splits netPayable among (allocationFor BPP).
            Once the payment is no longer PENDING, the BPP''s own account or its split is required; the
            BAP account is required when commission is greater than zero.

            '
        method:
          type: string
          enum:
          - QRIS
          - VIRTUAL_ACCOUNT
          - EWALLET
          - COD
          - BANK_TRANSFER
          - BI_FAST
          - RTGS
          - SKN
          - BNPL
          - CREDIT_CARD
          - DEBIT_CARD
          - DIRECT_DEBIT
          - CREDIT_FACILITY
          - ESCROW
        paymentRail:
          type: string
          description: 'Specific rail used for this payment. Enables downstream routing and reconciliation
            regardless of higher-level method. Example: method=BANK_TRANSFER with paymentRail=BI_FAST.

            '
          enum:
          - QRIS
          - BI_FAST
          - RTGS
          - SKN
          - VIRTUAL_ACCOUNT
          - EWALLET_OVO
          - EWALLET_DANA
          - EWALLET_GOPAY
          - EWALLET_SHOPEEPAY
          - EWALLET_LINKAJA
          - EWALLET_ASTRAPAY
          - CARD_VISA
          - CARD_MASTERCARD
          - CARD_JCB
          - CARD_AMEX
          - CARD_UNIONPAY
          - BILYET_GIRO
          - DIRECT_DEBIT
          - SWIFT_TT
          - LETTER_OF_CREDIT
          - COD_CASH
          - COD_CARD_TAP
        paymentGatewayProvider:
          type: string
          description: 'Payment gateway aggregator used to route this payment. Declared per transaction.
            Implementations may use one or more of these aggregators or direct bank/ewallet APIs.

            '
          enum:
          - DOKU
          - XENDIT
          - MIDTRANS
          - FINPAY
          - FASPAY
          - ESPAY
          - IPAY88
          - FINNET
          - LINKQU
          - DIRECT
          - OTHER
        methodDetail:
          oneOf:
          - $ref: '#/components/schemas/QRIS'
          - $ref: '#/components/schemas/VirtualAccount'
          - $ref: '#/components/schemas/EWallet'
          - $ref: '#/components/schemas/CashOnDelivery'
          - $ref: '#/components/schemas/BankTransfer'
          - $ref: '#/components/schemas/BISettlement'
          - $ref: '#/components/schemas/BNPL'
          - $ref: '#/components/schemas/CardPayment'
          x-ion-condition: Required when method requires instrument-specific fields
        timing:
          type: string
          enum:
          - ON_ORDER
          - PRE_FULFILLMENT
          - ON_FULFILLMENT
          - POST_FULFILLMENT
          description: When payment is collected relative to fulfilment.
        status:
          type: string
          enum:
          - PENDING
          - PAID
          - FAILED
          - REFUNDED
          - PARTIALLY_REFUNDED
        paidAt:
          type: string
          format: date-time
          description: Timestamp of successful payment confirmation
          x-ion-condition: Required after payment is confirmed
        gatewayRef:
          type: string
          description: Payment gateway transaction reference ID
          x-ion-condition: Required when payment gateway is used
        orderAmount:
          allOf:
          - $ref: '#/components/schemas/ReconAmount'
          description: 'Gross amount the buyer pays for this settlement: the order total in init and on_init,
            the amount paid from confirm on. When a contract has several settlements, each covers its
            own part.

            '
        commission:
          allOf:
          - $ref: '#/components/schemas/ReconAmount'
          description: 'The BAP''s entitlement: the buyer finder fee the BPP owes the BAP for the contract,
            equal to buyerFinderFee.feeAmount on the contract''s price consideration in force (IONTradeConsideration),
            which sums the offers'' fees. Zero when the offers carry no buyer finder fee.

            '
        withholdingAmount:
          allOf:
          - $ref: '#/components/schemas/ReconAmount'
          description: 'Amount kept back from the BPP''s side, for example against returns; breakup entries
            with includedIn WITHHOLDING itemize it.

            '
        refundAmount:
          allOf:
          - $ref: '#/components/schemas/ReconAmount'
          description: 'Total refunded to the buyer for this settlement; breakup entries with includedIn
            REFUND itemize it.

            '
        netPayable:
          allOf:
          - $ref: '#/components/schemas/ReconAmount'
          description: 'The BPP''s total entitlement for this settlement: orderAmount − commission − withholdingAmount
            − refundAmount, plus the effectOnNetPayable of each ADDITIONAL breakup entry. The BPP may
            split it among recipients in settlementAccounts; the BAP agrees the total, not the split.

            '
        recoveryAmount:
          allOf:
          - $ref: '#/components/schemas/ReconAmount'
          description: 'Amount owed back on a correction settlement (relatedSettlementId), for example
            after a chargeback or a refund forced after payout, when it exceeds what is still to be paid.
            Amounts are never negative; a recovery is stated here instead.

            '
        orderDate:
          type: string
          format: date
          description: 'Date the order was created, in Asia/Jakarta time (UTC+07:00), taken from the order''s
            original creation timestamp. Groups settlements by order day; it is not the due date.

            '
        breakup:
          type: array
          description: 'Optional itemization of the figures. Entries with includedIn COMMISSION, WITHHOLDING
            or REFUND explain part of that amount and are not deducted again; ADDITIONAL entries change
            netPayable by their effectOnNetPayable.

            '
          items:
            $ref: '#/components/schemas/FinancialComponent'
        collections:
          type: array
          description: 'Optional record of who collected the buyer''s money and how much, for the cases
            the payment fields do not describe: cash on delivery, credit, bank transfer, partial or mixed
            collection. Reported by the sender; it is not proof of funds. Its method and status are the
            collection''s (JSON-LD ion:collectionMethod and ion:collectionStatus), not the payment''s.

            '
          items:
            $ref: '#/components/schemas/CollectionInformation'
        settlementObligations:
          type: array
          description: 'Optional, informational: who is expected to pay whom, for example a cash-on-delivery
            collector remitting to the BPP and the BPP paying the BAP''s commission. Not a payment instruction;
            legs that pass on the same money are not added up as separate value.

            '
          items:
            $ref: '#/components/schemas/SettlementObligation'
        relatedSettlementId:
          type: string
          description: 'On a correction settlement, the Settlement.id of the earlier settlement it adjusts.
            The correction has its own Settlement.id; the earlier settlement is not sent or paid again.

            '
        adjustmentType:
          type: string
          enum:
          - CORRECTION
          - REFUND
          - CHARGEBACK
          - REVERSAL
          - PENALTY
          - OTHER
          description: Kind of correction. Requires relatedSettlementId.
        accord:
          type: boolean
          description: 'Set only in /on_reconcile, on every settlement. true — the counterparty agrees
            with the entitlements it received (commission and netPayable and the amounts that make them
            up); false — it disagrees (dispute code, diffValue) or the settlement is not ready (a pending
            dispute code). Agreement is per settlement: an agreed settlement stays agreed whatever happens
            to the others. It covers the BAP''s and the BPP''s entitlements, not the BPP''s split among
            its recipients, and it does not by itself release any payout.

            '
        dueDate:
          type: string
          format: date
          description: 'Date by which the payout is due: settlementWindow after the settlementBasis event
            of the commitments'' offers'' policies.settlement, the latest such date when the offers differ.
            Either participant may state it; required when accord is true.

            '
        dispute:
          $ref: '#/components/schemas/Dispute'
      x-ion-closed-extensions: false
    SettlementAccount:
      type: object
      title: Settlement Account
      description: 'A bank account that receives part of a settlement payout. BAP and BPP hold the network
        participants'' own accounts. The BPP may also split its share (netPayable) among the accounts
        of the sellers, logistics providers and other recipients it pays: such an entry has allocationFor
        BPP, and its allocatedAmount is the part of the BPP''s share it receives. A complete split''s
        allocations with allocationFor BPP add up to netPayable. The BAP''s agreement covers the BPP''s
        total, not this split or its accounts.

        '
      additionalProperties: false
      properties:
        holderRole:
          type: string
          enum:
          - BAP
          - BPP
          - SELLER
          - LOGISTICS
          - PROVIDER
          - OTHER
          description: 'Who owns the account. BAP and BPP are the network participants; SELLER, LOGISTICS,
            PROVIDER and OTHER are recipients of the BPP''s share.

            '
        holderId:
          type: string
          description: 'Identifier of the account holder: the subscriber ID for BAP and BPP, the BPP''s
            own identifier for a seller, logistics provider or other recipient. Required for SELLER, LOGISTICS,
            PROVIDER and OTHER.

            '
        bankCode:
          type: string
          description: Recipient bank code
        accountNumber:
          type: string
          description: Recipient bank account number
        accountName:
          type: string
          description: Recipient account holder name
        allocationFor:
          type: string
          enum:
          - BAP
          - BPP
          description: 'Whose share allocatedAmount comes from: BAP — the commission; BPP — netPayable.
            Required with allocatedAmount.

            '
        allocatedAmount:
          type: number
          minimum: 0
          description: 'Part of the allocationFor share this account receives, in the settlement currency.

            '
      dependentRequired:
        allocatedAmount:
        - allocationFor
      allOf:
      - if:
          properties:
            holderRole:
              enum:
              - SELLER
              - LOGISTICS
              - PROVIDER
              - OTHER
          required:
          - holderRole
        then:
          required:
          - holderId
          - allocationFor
          properties:
            allocationFor:
              const: BPP
      required:
      - holderRole
      - bankCode
      - accountNumber
    QRIS:
      type: object
      title: QRIS Payment
      description: Quick Response Code Indonesian Standard payment
      additionalProperties: false
      properties:
        qrisType:
          type: string
          enum:
          - STATIC
          - DYNAMIC
          description: 'STATIC: single fixed QR, same for all transactions. DYNAMIC: per-transaction QR
            with embedded amount.

            '
        merchantId:
          type: string
          description: QRIS merchant identifier from acquiring bank
          example: ID1023456789012345678
        nmid:
          type: string
          description: National Merchant ID assigned by Bank Indonesia
        terminalId:
          type: string
          description: Terminal/POS identifier for multi-terminal merchants
        qrisString:
          type: string
          description: Full QRIS string for QR code rendering
          x-ion-condition: Required for DYNAMIC QRIS returned at on_init
        expiresAt:
          type: string
          format: date-time
          description: Expiry for DYNAMIC QRIS. UTC (ISO 8601).
      x-ion-regulatory: PBI 21/18/PBI/2019 tentang Implementasi Standar Nasional Quick Response Code
      required:
      - qrisType
      - merchantId
    VirtualAccount:
      type: object
      title: Bank Virtual Account
      additionalProperties: false
      properties:
        bankCode:
          type: string
          enum:
          - BCA
          - BRI
          - MANDIRI
          - BNI
          - CIMB
          - PERMATA
          - BTN
          - DANAMON
          - MAYBANK
          - BSI
          description: Bank issuing the virtual account
        vaNumber:
          type: string
          description: Virtual account number to be paid to
        amount:
          type: number
          description: Amount encoded in VA (for fixed-amount VA)
        currency:
          type: string
          const: IDR
        expiresAt:
          type: string
          format: date-time
          description: VA expiry timestamp in UTC
      required:
      - bankCode
      - vaNumber
    EWallet:
      type: object
      title: Indonesia E-Wallet
      additionalProperties: false
      properties:
        provider:
          type: string
          x-ion-vocab: https://schema.ion.id/release1/schema/common/Payment/v1/vocab.jsonld#EWalletProvider
          description: E-wallet provider identifier
        accountRef:
          type: string
          description: Consumer's wallet account reference (phone or wallet ID)
        amount:
          type: number
        currency:
          type: string
          const: IDR
        expiresAt:
          type: string
          format: date-time
        deepLink:
          type: string
          format: uri
          description: Deep link to open wallet app for payment
      x-ion-regulatory: PBI 23/6/PBI/2021 tentang Penyedia Jasa Pembayaran
      required:
      - provider
    CashOnDelivery:
      type: object
      title: Cash On Delivery
      description: 'Runtime COD collection state. Offer-level COD policy fields (OTP required, denominations
        accepted, buyer daily limit, hold period, reconciliation variance) belong to Logistics Offer terms;
        the cash-on-delivery execution variant remains deferred in Release 1 pending an authoritative
        remittance-schedule policy. Those terms govern how COD is accepted, not the per-transaction collection
        record.

        '
      additionalProperties: false
      properties:
        collectionAmount:
          type: number
          description: Expected cash amount to collect from consumer
        collectionAmountCollected:
          type: number
          description: Actual cash amount the carrier collected
          x-ion-condition: Required after handover — actual amount collected
        collectionTimestamp:
          type: string
          format: date-time
          description: UTC timestamp of cash handover at delivery
          x-ion-condition: Required after handover
        collectionReceiptRef:
          type: string
          description: Receipt reference for the collected cash (scan, photo URL, or receipt ID)
        currency:
          type: string
          const: IDR
        changeIssuedBy:
          type: string
          enum:
          - PROVIDER
          - COURIER
          description: Who provides change to consumer
        maxCodAmount:
          type: number
          description: Maximum COD value allowed per ION network policy
        partialCollectionReason:
          type: string
          enum:
          - CONSUMER_SHORT_ON_CASH
          - DENOMINATION_UNAVAILABLE
          - CONSUMER_NEGOTIATED
          - CONSUMER_DISPUTED_AMOUNT
          - OTHER
          x-ion-condition: Required when collectionAmountCollected < collectionAmount
    BankTransfer:
      type: object
      title: Bank Transfer
      additionalProperties: false
      properties:
        bankCode:
          type: string
          description: Recipient bank code
        accountNumber:
          type: string
          description: Recipient bank account number
        accountName:
          type: string
          description: Recipient account holder name
        transferType:
          type: string
          enum:
          - ATM
          - INTERNET_BANKING
          - MOBILE_BANKING
          - TELLER
      required:
      - bankCode
      - accountNumber
    BISettlement:
      type: object
      title: Bank Indonesia Settlement Rail
      description: BI-FAST, RTGS, or SKN bank settlement
      additionalProperties: false
      properties:
        settlementType:
          type: string
          enum:
          - BI_FAST
          - RTGS
          - SKN
          description: 'BI_FAST: real-time settlement, max IDR 250 million per transaction. RTGS: high-value
            same-day settlement, unlimited amount. SKN: batch clearing, lower value transactions.

            '
        biRef:
          type: string
          description: BI clearing reference number
        settlementAt:
          type: string
          format: date-time
          description: Settlement timestamp in UTC
        beneficiaryName:
          type: string
        beneficiaryBank:
          type: string
        beneficiaryAccount:
          type: string
        ifscEquivalent:
          type: string
          description: Indonesian equivalent — bank routing code
      x-ion-regulatory: PBI 22/23/PBI/2020 tentang Sistem Pembayaran; SNAP BI specification
      required:
      - settlementType
    BNPL:
      type: object
      title: Buy Now Pay Later
      additionalProperties: false
      properties:
        provider:
          type: string
          x-ion-vocab: https://schema.ion.id/release1/schema/common/Payment/v1/vocab.jsonld#BNPLProvider
          description: BNPL provider name
        tenure:
          type: integer
          description: Repayment tenure in months
          example: 3
        installmentAmount:
          type: number
          description: Per-installment amount in IDR
        interestRate:
          type: number
          description: Monthly interest rate as decimal e.g. 0.02 = 2%
        totalRepayment:
          type: number
          description: Total repayment amount including interest
        currency:
          type: string
          const: IDR
        firstPaymentDate:
          type: string
          format: date
      required:
      - provider
    CardPayment:
      type: object
      title: Credit or Debit Card Payment
      additionalProperties: false
      properties:
        cardType:
          type: string
          enum:
          - CREDIT
          - DEBIT
        scheme:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - JCB
          - AMEX
          - UNIONPAY
        maskedPan:
          type: string
          description: Last 4 digits of card for display
          example: '****4242'
        bankIssuer:
          type: string
          description: Card-issuing bank name
        gatewayRef:
          type: string
          description: Payment gateway transaction reference
      required:
      - cardType
      - scheme
    ReconAmount:
      type: object
      title: ReconAmount
      description: 'One settlement component. In /on_reconcile, diffValue is the counterparty''s value
        minus the value in the /reconcile being answered; it is present only when the two differ.

        '
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: number
          minimum: 0
          description: Component amount in the settlement currency.
        diffValue:
          type: number
          description: Counterparty's value minus the value it is answering, when they differ.
    FinancialComponent:
      type: object
      title: FinancialComponent
      description: 'One itemized part of a settlement''s figures. Amounts are explained once: an entry
        included in commission, withholdingAmount or refundAmount is not deducted again.

        '
      additionalProperties: false
      required:
      - code
      - includedIn
      - amount
      allOf:
      - if:
          properties:
            includedIn:
              const: ADDITIONAL
          required:
          - includedIn
        then:
          required:
          - effectOnNetPayable
      properties:
        code:
          type: string
          enum:
          - PPN
          - PPH
          - PAYMENT_FEE
          - SELLER_APP_FEE
          - NETWORK_FEE
          - LOGISTICS
          - SELLER_FUNDED_DISCOUNT
          - BUYER_APP_SUBSIDY
          - PENALTY
          - COMPENSATION
          - CANCELLATION
          - RETURN
          - FORCED_REFUND
          - CHARGEBACK
          - CORRECTION
          - OFFSET
          - ROUNDING
          - OTHER
          description: 'Category. PPN is Indonesian value-added tax and PPH Indonesian income-tax withholding;
            Release 1 withholds no tax from payouts, so tax entries only explain the figures.

            '
        includedIn:
          type: string
          enum:
          - COMMISSION
          - WITHHOLDING
          - REFUND
          - ADDITIONAL
          description: 'The amount this entry is part of. ADDITIONAL: not part of commission, withholdingAmount
            or refundAmount; it changes netPayable by effectOnNetPayable.

            '
        amount:
          type: number
          minimum: 0
          description: Size of the entry, in the settlement currency.
        effectOnNetPayable:
          type: number
          description: 'Signed change to netPayable; required when includedIn is ADDITIONAL. Negative
            for a fee or penalty charged to the BPP, positive for a credit to it.

            '
        referenceId:
          type: string
          description: Reference for the entry, such as an invoice or a return ID.
    CollectionInformation:
      type: object
      title: CollectionInformation
      description: 'One collection of the buyer''s money, as reported by the sender. Not proof of funds:
        SEAM verifies collections separately.

        '
      additionalProperties: false
      required:
      - method
      - status
      properties:
        method:
          type: string
          enum:
          - PREPAID
          - COD
          - BANK_TRANSFER
          - CREDIT
          - MIXED
          - OTHER
          description: How the buyer pays this part.
        status:
          type: string
          enum:
          - NOT_COLLECTED
          - PARTIALLY_COLLECTED
          - COLLECTED
          - REVERSED
          - UNKNOWN
          description: How far this part has been collected.
        collectorRole:
          type: string
          enum:
          - PJP
          - BAP
          - BPP
          - SELLER
          - LOGISTICS
          - BUYER
          - OTHER
          description: 'Who holds the money collected; BUYER when nothing has been collected yet on credit.

            '
        collectorId:
          type: string
          description: Identifier of the collector, such as a subscriber ID or the BPP's ID for a seller
            or courier.
        reportedCollectedAmount:
          type: number
          minimum: 0
          description: Amount the sender reports as collected so far.
        referenceId:
          type: string
          description: Reference for the collection, such as a payment-gateway or invoice reference.
        dueDate:
          type: string
          format: date
          description: When the buyer must pay, for credit.
    SettlementObligation:
      type: object
      title: SettlementObligation
      description: 'One expected payment between parties, for information. It is not a payment instruction.

        '
      additionalProperties: false
      required:
      - payerId
      - payeeId
      - amount
      properties:
        payerId:
          type: string
          description: Who is expected to pay.
        payeeId:
          type: string
          description: Who is expected to receive.
        amount:
          type: number
          minimum: 0
          description: Expected amount, in the settlement currency.
        purpose:
          type: string
          enum:
          - BPP_PROCEEDS
          - BAP_COMMISSION
          - COD_REMITTANCE
          - REFUND
          - OTHER
          description: What the payment is for.
        dueDate:
          type: string
          format: date
        referenceId:
          type: string
    Dispute:
      type: object
      title: Dispute
      description: 'Why a settlement has accord false. Required when accord is false. The code says whether
        the settlement is disputed or only pending.

        '
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - ORDER_AMOUNT_MISMATCH
          - COMMISSION_MISMATCH
          - WITHHOLDING_MISMATCH
          - REFUND_MISMATCH
          - TAX_MISMATCH
          - ADJUSTMENT_MISMATCH
          - MISSING_CONTRACT
          - MISSING_SETTLEMENT
          - DUPLICATE_SETTLEMENT
          - OTHER
          - SETTLEMENT_WINDOW_NOT_REACHED
          - AWAITING_INFORMATION
          description: 'Machine-readable reason. SETTLEMENT_WINDOW_NOT_REACHED (sent before the settlement
            is due) and AWAITING_INFORMATION (the answering participant lacks what it needs to check the
            figures) make the settlement pending; it is sent again later. Every other code makes it disputed.

            '
        field:
          type: string
          description: 'Name of the field in dispute, for example commission or a breakup code, when the
            disagreement is about one figure.

            '
          examples:
          - commission
        referenceId:
          type: string
          description: Reference the disagreement rests on, such as an invoice or settlement ID.
        description:
          type: string
          description: Human-readable explanation of the disagreement.
