  /api/v1/catalogs/{id}/publish:
    post:
      consumes:
      - application/json
      description: |-
        Builds the catalog from the DB (resources, offers and considerations, default terms filled in, isActive from the pause flag; media with a blank uri dropped) and sends it as a signed catalog/publish request to CDS_PUBLISH_URL (onix-catalog-publish), logged to beckn_message_log. On a 2xx reply network_published_at is stamped. Publishing doesn't lock the catalog; it can be edited and published again.
        The body is optional; {"forceBaseline": true} makes onix-catalog-publish write a fresh baseline instead of a diff.
      operationId: publishCatalog
      parameters:
      - description: Catalog id, without the <bppId>/ prefix
        in: path
        name: id
        required: true
        type: string
      - description: Optional publish options
        in: body
        name: body
        schema:
          $ref: '#/definitions/dashboardsvc.PublishCatalogRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Accepted by the publish endpoint
          schema:
            $ref: '#/definitions/dashboardsvc.PublishCatalogResponse'
        "400":
          description: CDS_PUBLISH_URL not configured, or catalog has no products
            or offers to publish
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "404":
          description: Catalog doesn't exist, is deleted, or belongs to another seller
            (catalog not found)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: 'DB error, or the Beckn signature header couldn''t be built
            (build auth header: ...)'
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "502":
          description: 'CDS_PUBLISH_URL couldn''t be reached or returned a non-2xx
            reply (e.g. CDS returned 400: ...)'
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Publish a catalog to the network
      tags:
      - catalogs
