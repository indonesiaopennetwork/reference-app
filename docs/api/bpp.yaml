      - description: Offer id
        in: path
        name: oid
        required: true
        type: string
      - description: Offer with its considerations
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/catalog.Offer'
      produces:
      - application/json
      responses:
        "200":
          description: Updated
          schema:
            $ref: '#/definitions/dashboardsvc.StatusUpdatedResponse'
        "400":
          description: Invalid JSON, or descriptor.name or resourceIds is empty (offer
            name and at least one resource are required)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
