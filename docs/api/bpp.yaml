            $ref: '#/definitions/dashboardsvc.OrderListResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the seller's orders (contracts)
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      description: Returns one of the seller's contracts with its commitments (and
        their offers) and its considerations.
      operationId: getOrder
      parameters:
      - description: Contract (order) id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order detail
          schema:
            $ref: '#/definitions/dashboardsvc.OrderDetailResponse'
        "400":
          description: id is not a UUID (invalid contract id)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "404":
          description: No such contract for this seller (order not found)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get one order with commitments and considerations
      tags:
      - orders
  /api/v1/orders/{id}/fulfillment-status:
    put:
      consumes:
      - application/json
      description: |-
        Writes the status to contract_performances and into the stored contract's first non-RETURN performance, then sends an unsolicited on_status to the BAP through the onix-bpp caller (synchronously, 30 s timeout; errors are only logged) and logs it to beckn_message_log.
        Delivered stamps delivered_at (starting the return window) and can make the contract COMPLETE. A background sweep (every 2 s) moves Shipped orders to Delivered after 10 s and sends on_status again. Statuses starting with Return are rejected; the offer's return policy sets them.
      operationId: updateFulfillmentStatus
      parameters:
      - description: Contract (order) id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: New fulfillment status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dashboardsvc.FulfillmentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated
          schema:
            $ref: '#/definitions/dashboardsvc.StatusUpdatedResponse'
        "400":
          description: id is not a UUID, status is missing, or status starts with
            Return (return status is set by the return policy, not manually)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "404":
          description: No such contract for this seller (order not found)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set an order's fulfillment status
      tags:
      - orders
  /api/v1/providers:
    get:
      description: Returns a list with only the seller's own provider (at most one
        row); a list for frontend compatibility.
      operationId: listProviders
      produces:
      - application/json
      responses:
        "200":
          description: Provider list
          schema:
            $ref: '#/definitions/dashboardsvc.IDNameListResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: The seller's own provider
      tags:
      - catalogs
  /api/v1/ratings:
    get:
      description: Paginated list of ratings received through /rate on the seller's
        orders.
      operationId: listRatings
      parameters:
      - default: 1
        description: 1-based page number; values that are not numbers or below 1 become
          1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size; values that are not numbers or outside 1..100 fall
          back to 20
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of ratings
          schema:
            $ref: '#/definitions/dashboardsvc.RatingListResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List ratings
      tags:
      - dashboard
  /api/v1/reconciliation:
    get:
      description: 'For each BAP: the seller''s contracts whose settlement is not
        yet agreed, split into due (due now or disputed) and upcoming; the summary
        the next /reconcile would carry; and the disputed batch that would be sent
        again. Also returns the BPP''s default payout terms and the 50 most recent
        reconciliation batches (sent or received). Read-only.'
      operationId: getReconciliationOverview
      produces:
      - application/json
      responses:
        "200":
          description: Overview
          schema:
            $ref: '#/definitions/reconsvc.ReconciliationOverviewResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reconciliation overview per BAP
      tags:
      - reconciliation
  /api/v1/reconciliation/send:
    post:
      consumes:
      - application/json
      description: |-
        Builds a /reconcile for one BAP and sends it through the onix-bpp caller. With contract_ids it sends the listed contracts that are due or disputed, as a new batch; without them, the disputed batch again in full, or else everything due.
        The batch is first recorded in reconciliations (status SENDING) and its payments marked PENDING; if the send fails the batch is marked FAILED and the payments go back to their earlier state. The BAP's /on_reconcile arrives later at /api/webhook/on_reconcile. On 200 the batch status is SENT, or already the BAP's outcome if /on_reconcile arrived first.
      operationId: sendReconciliation
      parameters:
      - description: BAP and optional contracts
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/reconsvc.ReconciliationSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sent
          schema:
            $ref: '#/definitions/reconsvc.ReconciliationSendResponse'
        "400":
          description: Invalid JSON or a missing required field (gin binding error
            text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "409":
          description: None of the seller's contracts with the BAP is due, or none
            of the selected ones is (no contracts are due for reconciliation with
            this BAP)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "502":
          description: Not delivered; the batch is still recorded as FAILED and returned
          schema:
            $ref: '#/definitions/reconsvc.ReconciliationSendErrorResponse'
      security:
      - BearerAuth: []
      summary: Send /reconcile to a BAP
      tags:
      - reconciliation
  /api/v1/support-tickets:
    get:
      description: Paginated list of support tickets raised by BAPs through /support
        on the seller's orders.
      operationId: listSupportTickets
      parameters:
      - default: 1
        description: 1-based page number; values that are not numbers or below 1 become
          1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size; values that are not numbers or outside 1..100 fall
          back to 20
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Page of tickets
          schema:
            $ref: '#/definitions/dashboardsvc.SupportTicketListResponse'
        "401":
          description: Bearer token missing (missing bearer token), or invalid or
            expired (invalid or expired token)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Valid token, but no seller profile (users row) for it; call
            POST /api/v1/auth/bootstrap
          schema:
            $ref: '#/definitions/auth.NoProviderResponse'
        "500":
          description: Database or internal error (raw error text)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List support tickets
      tags:
      - dashboard
  /api/webhook/cancel:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: fully cancels
        the ACTIVE contract (every commitment CLOSED, the price consideration CANCELLED,
        a cancellation fee and refund settlement added, stock restored; reason from
        message.contract.contractAttributes.cancellation) and sends on_cancel. If
        the cancellation fails, nothing is sent.'
      operationId: becknCancel
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn cancel
      tags:
      - beckn webhooks
  /api/webhook/catalog/on_publish:
    post:
      consumes:
      - application/json
      description: 'STUB, meant for the CDS to report whether a published catalog
        was indexed. It does nothing yet: always returns the alya success envelope
        with data null and stores nothing.'
      operationId: becknCatalogOnPublish
      parameters:
      - description: Indexing result from the CDS (ignored)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: alya success envelope with no data
          schema:
            $ref: '#/definitions/server.WscSuccessResponse'
      security: []
      summary: Catalog indexing result (STUB)
      tags:
      - beckn webhooks
  /api/webhook/confirm:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: checks that
        the contract carries settlements (payment proof), applies the stored offer
        terms, and in one transaction makes the DRAFT contract and its commitments
        ACTIVE and records the settlements as COMPLETE; then sends on_confirm. If
        the state change fails, no on_confirm is sent and the failure is only logged
        as NACK in beckn_message_log.'
      operationId: becknConfirm
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn confirm
      tags:
      - beckn webhooks
  /api/webhook/init:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: adds the
        seller''s payout terms and settlement account to the contract, creates the
        DRAFT contract for this transaction (or updates the existing one) with its
        participants, commitments, considerations and performances, and sends on_init
        echoing the contract with its assigned id.'
      operationId: becknInit
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn init
      tags:
      - beckn webhooks
  /api/webhook/on_reconcile:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK echoing context as received, then works
        asynchronously: sets the outbound batch message.reconciliationId to AGREED
        (only when every due contract has accord true and the BAP said AGREED), DISPUTED,
        or PENDING (some contracts were sent before their settlement window), and
        updates each contract''s settlement reconciliation state to match. Nothing
        is sent back.'
      operationId: becknOnReconcile
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ACK; context is the inbound context as received
          schema:
            $ref: '#/definitions/server.ReconAckResponse'
        "400":
          description: The body is not a JSON object (NACK, no context)
          schema:
            $ref: '#/definitions/server.ReconNackResponse'
      security: []
      summary: BAP's answer to this BPP's /reconcile
      tags:
      - beckn webhooks
  /api/webhook/rate:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: finds the
        contract by context.transactionId, stores each message.ratingInputs[] entry
        as a rating (target_id is always the contract id), and sends on_rate echoing
        the targets and ranges. If no contract is found, nothing is stored or sent.'
      operationId: becknRate
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn rate
      tags:
      - beckn webhooks
  /api/webhook/reconcile:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK echoing context as received, then works
        asynchronously: checks each contract''s figures against this BPP''s own (the
        batch is AGREED only if every contract agrees, otherwise DISPUTED), records
        an INBOUND reconciliations row, updates the settlement states, and sends on_reconcile
        through the onix-bpp caller.'
      operationId: becknReconcile
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ACK; context is the inbound context as received
          schema:
            $ref: '#/definitions/server.ReconAckResponse'
        "400":
          description: The body is not a JSON object (NACK, no context)
          schema:
            $ref: '#/definitions/server.ReconNackResponse'
      security: []
      summary: A BAP's own /reconcile
      tags:
      - beckn webhooks
  /api/webhook/select:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: looks up
        each commitment''s offer and resources in the DB and adds full details, prices
        the quote (per-unit BASE_PRICE and TAX lines times quantity, plus a contract
        consideration with status QUOTED), adds the seller''s offer terms and commission,
        and sends on_select through the onix-bpp caller. Nothing is written except
        the message log.'
      operationId: becknSelect
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn select
      tags:
      - beckn webhooks
  /api/webhook/status:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: finds the
        contract by context.transactionId, loads its latest stored state, and sends
        on_status with the contract id and status code. If the transaction id is invalid
        or no contract is found, nothing is sent.'
      operationId: becknStatus
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn status
      tags:
      - beckn webhooks
  /api/webhook/support:
    post:
      consumes:
      - application/json
      description: 'Returns a synchronous ACK, then works asynchronously: creates
        a support ticket from message.support (orderId is treated as a transaction
        id when linking it to a contract) and sends on_support with the ticket id
        and the BPP''s hard-coded support channels.'
      operationId: becknSupport
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn support
      tags:
      - beckn webhooks
  /api/webhook/track:
    post:
      consumes:
      - application/json
      description: 'STUB, not implemented: always returns the alya success envelope
        with data null, not a Beckn ACK. Nothing is stored and no on_track is sent.'
      operationId: becknTrack
      parameters:
      - description: Beckn message forwarded by onix-bpp (ignored)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: alya success envelope with no data
          schema:
            $ref: '#/definitions/server.WscSuccessResponse'
      security: []
      summary: Beckn track (STUB)
      tags:
      - beckn webhooks
  /api/webhook/update:
    post:
      consumes:
      - application/json
      description: Returns a synchronous ACK, then works asynchronously. An update
        adding a RETURN performance is a return request, decided by the offer's return
        policy; one lowering a commitment's quantity or marking it CLOSED is a partial
        cancellation; any other update is stored as the contract's latest state. Then
        sends on_update with the resulting contract, unless the update failed.
      operationId: becknUpdate
      parameters:
      - description: Beckn message forwarded by onix-bpp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.BecknWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous ACK; context echoes the inbound context fields
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
        "400":
          description: 'NACK: body not decodable into the request type (context then
            all empty strings), or context.bapUri empty (context echoed). No reason
            field'
          schema:
            $ref: '#/definitions/server.BecknAckResponse'
      security: []
      summary: Beckn update
      tags:
      - beckn webhooks
  /health:
    get:
      description: 'Liveness probe for load balancers and Kubernetes. Always returns
        the alya success envelope with data {"status": "ok"}.'
      operationId: getHealth
      produces:
      - application/json
      responses:
        "200":
          description: Service is up
          schema:
            $ref: '#/definitions/server.HealthResponse'
      security: []
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Zitadel access token, as "Bearer <token>". Dashboard routes also
      require a seller profile (403 NO_PROVIDER otherwise).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
