name: beckn-app

# ─────────────────────────────────────────────────────────────────────────────
# Shared Beckn network: BPP ↔ BAP ↔ ONIX adapter ↔ Postgres
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Postgres (shared, three databases: bpp / bap / zitadel) ──────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres # default admin db, not used by services
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - beckn

  # ─── DB migrations ──────────────────────────────────────────────────────
  # Idempotent one-shot jobs (tern migrate — safe to run every startup, it
  # tracks applied migrations in its own schema_migrations table and skips
  # what's already there). Production runs the equivalent as Cloud Run jobs
  # (migrate-bap/migrate-bpp, see Taskfile.yaml deploy:migrate) — this is
  # the same Dockerfile.migrate, wired in for local dev too, so bap/bpp
  # never crash-loop on "relation ... does not exist" after a fresh clone
  # or a reset postgres_data volume: bap/bpp's own depends_on below waits
  # for these to actually finish successfully before starting.
  migrate-bap:
    build:
      context: ./bap-application
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: bap
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    networks:
      - beckn

  migrate-bpp:
    build:
      context: ./bpp-application
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: bpp
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    networks:
      - beckn

  # ─── Zitadel (seller login/registration identity provider) ────────────────
  # Runs the classic hosted login UI (LOGINV2 explicitly disabled) so this is
  # a single container -- Zitadel's newer "Login V2" architecture needs a
  # second Next.js container plus a reverse proxy in front of both, which
  # doesn't fit this project's per-service-own-port style. Login V1 is on a
  # deprecation path upstream (removed in a future Zitadel major version) but
  # fully supported today and documented by Zitadel itself as fine for local
  # evaluation -- revisit if/when it's actually removed.
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8090
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"

      ZITADEL_DATABASE_POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/zitadel?sslmode=disable

      # Classic hosted login UI at /ui/login, served directly by this
      # container -- see the comment above the service.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"

      ZITADEL_FIRSTINSTANCE_ORG_NAME: reference-app

      # Human admin account, for debugging via Zitadel's own console
      # (localhost:8090/ui/console) -- not used by any app code.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"

      # Machine user + Personal Access Token, auto-created at first boot and
      # written to ZITADEL_FIRSTINSTANCE_PATPATH inside the container (bind
      # mounted below) -- scripts/setup-zitadel.sh reads it from there to
      # drive Zitadel's own Management API with no manual console step.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Reference App Automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      - ./.zitadel-machinekey:/machinekey
    ports:
      - "8090:8080"
    healthcheck:
      test: [ "CMD", "/app/zitadel", "ready" ]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beckn

  # ─── ONIX Adapter Infrastructure ──────────────────────────────────────────
  redis-bap:
    image: redis:alpine
    container_name: redis-bap
    networks:
      - beckn
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-bpp:
    image: redis:alpine
    container_name: redis-bpp
    networks:
      - beckn
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── OTel companion collectors ─────────────────────────────────────────────
  # Filter onix's telemetry down to network-relevant signals and forward to
  # netcol.staging.ion.id. Same image for both — see otel-collector/.
  otel-collector-bap:
    build:
      context: ./otel-collector
    container_name: otel-collector-bap
    restart: unless-stopped
    environment:
      # Defaults to ion-monitor's staging deployment. Override in .env to
      # point at a local ion-monitor instead (e.g.
      # http://host.docker.internal:4320) — see extra_hosts below and
      # otel-collector/config.yaml's comment.
      NETWORK_COLLECTOR_ENDPOINT: ${NETWORK_COLLECTOR_ENDPOINT:-https://netcol.staging.ion.id}
    extra_hosts:
      # Lets NETWORK_COLLECTOR_ENDPOINT point at a collector running on the
      # host (e.g. a local ion-monitor stack) without joining any extra
      # Docker network. Inert when NETWORK_COLLECTOR_ENDPOINT doesn't
      # reference host.docker.internal, so safe to leave on unconditionally.
      - "host.docker.internal:host-gateway"
    networks:
      - beckn

  otel-collector-bpp:
    build:
      context: ./otel-collector
    container_name: otel-collector-bpp
    restart: unless-stopped
    environment:
      # See otel-collector-bap's identical NETWORK_COLLECTOR_ENDPOINT comment.
      NETWORK_COLLECTOR_ENDPOINT: ${NETWORK_COLLECTOR_ENDPOINT:-https://netcol.staging.ion.id}
    extra_hosts:
      # See otel-collector-bap's identical extra_hosts comment.
      - "host.docker.internal:host-gateway"
    networks:
      - beckn

  onix-bap:
    image: fidedocker/onix-adapter:1.9.0
    container_name: onix-bap
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - beckn
    # Bypass Docker's embedded DNS proxy (127.0.0.11) for external lookups.
    # This image is Alpine-based (musl libc), which has a well-documented
    # flakiness issue with Docker's embedded resolver under bursty/
    # concurrent DNS queries -- exactly what schema validation does here
    # (several schema.ion.id/raw.githubusercontent.com lookups per select).
    # Querying a real public resolver directly sidesteps it.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8081:8081"
    environment:
      CONFIG_FILE: "/app/config/local-simple-bap.yaml"
      REDIS_ADDR: redis-bap:6379
      # onix's own otelsetup config (local-simple-bap.yaml) is what actually
      # ships telemetry; these are just SDK-standard env var parity.
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector-bap:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      redis-bap:
        condition: service_healthy
      otel-collector-bap:
        condition: service_started
    volumes:
      - ./config:/app/config
    command: [ "./server", "--config=/app/config/local-simple-bap.yaml" ]

  onix-bpp:
    image: fidedocker/onix-adapter:1.9.0
    container_name: onix-bpp
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - beckn
    # See onix-bap's identical dns: override above -- same Alpine/Docker
    # embedded-DNS-proxy flakiness applies here too.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8082:8082"
    environment:
      CONFIG_FILE: "/app/config/local-simple-bpp.yaml"
      REDIS_ADDR: redis-bpp:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector-bpp:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      redis-bpp:
        condition: service_healthy
      otel-collector-bpp:
        condition: service_started
    volumes:
      - ./config:/app/config
    command: [ "./server", "--config=/app/config/local-simple-bpp.yaml" ]

  # ─── Catalog Publish (standalone) ─────────────────────────────────────────
  # File-based catalog/publish, isolated from onix-bpp's txn routes and from
  # bap's own Postgres/CDS-forwarding publish route. See
  # file-onboarding-and-catalog-publish/README.md.
  # NOT fidedocker/onix-adapter -- that image lacks the catalogPublish handler.
  onix-catalog-publish:
    image: fidedocker/catalog-publisher:latest
    container_name: onix-catalog-publish
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - beckn
    ports:
      - "8085:8085"
    environment:
      CONFIG_FILE: "/app/config/catalog-publish.yaml"
      REDIS_ADDR: redis-bpp:6379
    depends_on:
      redis-bpp:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./file-onboarding-and-catalog-publish/data/beckn:/beckn
    command: [ "./server", "--config=/app/config/catalog-publish.yaml" ]

  # ─── Catalog file server ───────────────────────────────────────────────────
  # onix-catalog-publish (above) writes real, signed catalog index/baseline/
  # change files under file-onboarding-and-catalog-publish/data/beckn/, but
  # only as a shared volume -- nothing serves that directory over HTTP
  # (catalog-publish.yaml.example's own comment: "No reverse proxy serves
  # this folder publicly yet"). discovery-service's internal/dedicrawl needs
  # an HTTP URL to crawl, so this is that reverse proxy: a plain, read-only
  # static file server over the same directory, internal-network-only.
  catalog-files:
    image: nginx:alpine
    container_name: catalog-files
    restart: unless-stopped
    volumes:
      - ./file-onboarding-and-catalog-publish/data/beckn:/usr/share/nginx/html:ro
    networks:
      - beckn

  # ─── Mock CDS (Local Only) ────────────────────────────────────────────────
  # Simple Python stub, kept alongside the real discovery-service below as a
  # lightweight alternative -- only one is ever actually used at a time,
  # picked by which URL CDS_DISCOVER_URL (root .env) points bap-application's
  # DiscoverSync at (http://mock-cds:8086 vs http://discovery-service:8087),
  # no code changes required to switch.
  mock-cds:
    image: python:3.9-alpine
    container_name: mock-cds
    restart: unless-stopped
    ports:
      - "8086:8086"
    networks:
      - beckn
    environment:
      # Signs the async on_discover callback -- see mock-cds.py's
      # sign_beckn_header. Mock-cds has no identity of its own registered
      # on the real DeDi registry onix-bap's bapTxnReceiver checks against,
      # so (same trick DS_PRIVATE_KEY already uses for discovery-service,
      # see root .env) it signs as the BAP's own already-registered
      # identity instead of a fabricated, unresolvable one.
      BAP_KEY_ID: ${BAP_KEY_ID}
      BAP_PRIVATE_KEY: ${BAP_PRIVATE_KEY}
    volumes:
      - ./scripts/mock-cds.py:/app/mock-cds.py:ro
      - ./file-onboarding-and-catalog-publish/data/beckn:/beckn:ro
    # cryptography isn't in the base image -- installed at container start
    # rather than a custom Dockerfile, since mock-cds stays a zero-build
    # single-file stub everywhere else.
    command: [ "sh", "-c", "pip install --quiet --no-cache-dir cryptography && python -u /app/mock-cds.py" ]

  # ─── Discovery Service ─────────────────────────────────────────────────────
  # Real Go /discover implementation (textSearch/filters/spatial intent
  # matching) — kept alongside mock-cds above as the other of the two
  # interchangeable /discover targets (see mock-cds's comment). Crawls real,
  # signed Provider Node catalog index/baseline/change files
  # (internal/dedicrawl, see its own CONTEXT.md D19); no persistent
  # storage of its own. See discovery-service/README.md and CONTEXT.md
  # for the full design.
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    restart: unless-stopped
    depends_on:
      bpp:
        condition: service_started
      catalog-files:
        condition: service_started
    environment:
      PORT: "8087"
      LOG_LEVEL: info

      # Default (10s) is too tight for delivering on_discover to onix-bap:
      # its bapTxnReceiver's Extended Schema validation resolves a chain
      # of remote $ref schemas (TradeResource -> TradeOffer -> RetailOffer
      # -> AcceptedPaymentMethod, ...) from schema.ion.id on a COLD cache,
      # each hop a separate fetch -- easily exceeding 10s the first time.
      # onix caches resolved schemas for 24h (extendedSchema_cacheTTL in
      # config/local-simple-bap.yaml), so this long timeout is only ever
      # actually used once per onix-bap restart; every call after that is
      # fast. Without enough budget here, discovery-service cancels the
      # request mid-flight and onix-bap's fetch fails with "context
      # canceled" -- not a schema or auth problem, a timeout one.
      DISPATCH_DELIVERY_TIMEOUT_SECONDS: "45"

      # The outer DISPATCH_DELIVERY_TIMEOUT_SECONDS above is meaningless
      # without this: the underlying http.Client used to actually deliver
      # on_discover has ITS OWN, separate Timeout (defaults to 10s --
      # DispatchClientTimeout in main.go), and that inner one fires first,
      # cancelling the request mid-flight before the outer 45s budget is
      # ever used. Must be >= DISPATCH_DELIVERY_TIMEOUT_SECONDS.
      DISPATCH_CLIENT_TIMEOUT_SECONDS: "45"

      # Outbound on_discover callbacks are signed as discovery-service's
      # OWN, INDEPENDENT identity -- deliberately NOT the reference app's
      # BAP_ID/BPP_ID or their private keys. Discovery Service is its own
      # network participant architecturally (it can aggregate catalogs
      # from many Provider Platforms, not just this repo's own bpp), so it
      # needs its own dedicated Ed25519 keypair, not one borrowed from a
      # participant it happens to be deployed alongside -- see
      # discovery-service/CONTEXT.md D20/D21/D22 for why an earlier version
      # of this wrongly signed as the reference app's BPP identity instead,
      # and why the container-side var names below used to say "BPP_*"
      # even though they've never meant "the reference app's BPP".
      # DS_ID/DS_KEY_ID/DS_PRIVATE_KEY/DS_URI are generated once for this
      # service alone (see .env.example) -- left unset, the service falls
      # back to a fresh ephemeral key every restart and logs a warning,
      # which is honest (no signature spoofing another identity) even
      # though nothing can verify it until it's actually registered
      # somewhere (a real, out-of-band registration step -- see
      # INFRA_SETUP.md's "ask whoever administers the network registry"
      # process, the same one used for BAP_ID/BPP_ID).
      SUBSCRIBER_ID: ${DS_ID}
      SUBSCRIBER_URI: ${DS_URI}
      SUBSCRIBER_KEY_ID: ${DS_KEY_ID}
      SIGNING_PRIVATE_KEY_BASE64: ${DS_PRIVATE_KEY}

      # Inbound /discover requests are only accepted when signed by this
      # trusted caller (in this deployment, our own BAP, whose onix
      # bapTxnCaller signs every outbound request) -- see
      # internal/handlers.VerifyMiddleware. Named "TRUSTED_CALLER_*", not
      # "BAP_*": which participant is trusted here is this deployment's
      # choice, not something Discovery Service should hard-code by role.
      # TRUSTED_CALLER_KEY_ID reuses BAP_KEY_ID as-is -- just a public
      # identifier, safe to share. TRUSTED_CALLER_PUBLIC_KEY_BASE64 is
      # deliberately BAP's PUBLIC key ONLY (BAP_ONIX_SIGNING_PUBLIC_KEY),
      # never BAP_PRIVATE_KEY: this service only ever needs to verify as
      # the trusted caller, never sign as it, so it must never be handed a
      # credential capable of doing that. Leaving either unset disables
      # verification (logged as a warning).
      TRUSTED_CALLER_KEY_ID: ${BAP_KEY_ID}
      TRUSTED_CALLER_PUBLIC_KEY_BASE64: ${BAP_ONIX_SIGNING_PUBLIC_KEY}

      # Crawls real, signed Provider Node catalog index/baseline/change
      # files this reference-app's OWN bpp actually publishes — see
      # discovery-service's own CONTEXT.md D19. bpp forwards every catalog
      # publish to onix-catalog-publish (CDS_PUBLISH_URL below), which
      # writes real index/baseline/change files under
      # file-onboarding-and-catalog-publish/data/beckn/; catalog-files (an
      # nginx static server over that same directory) is what makes that
      # reachable over HTTP for this crawler. Sourced from root .env so it
      # can be overridden without editing this file (e.g. pointed at a
      # real remote index like
      # https://bpp-backend2.ion-ref-app.ayushmatha.in/index/becknCatalogs.index.json).
      CATALOG_INDEX_URLS: ${CATALOG_INDEX_URLS}
      CATALOG_REFRESH_INTERVAL_SECONDS: "10"
    ports:
      - "8087:8087"
    networks:
      - beckn

  # ─── BPP Application ──────────────────────────────────────────────────────
  bpp:
    build:
      context: ./bpp-application
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bpp:
        condition: service_completed_successfully
      onix-bpp:
        condition: service_started
      zitadel:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      APP_ENV: development
      LOG_LEVEL: info

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bpp
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable

      # bpp's registered subscriber identity. Sourced from the git-ignored
      # root .env file.
      BPP_ID: ${BPP_ID}
      # Bare registered Subscriber URL, not the internal /bpp/receiver path —
      # goes straight into context.bppUri (matches remiges-trade).
      BPP_URI: http://onix-bpp:8082/bpp/receiver
      NETWORK_ID: ${NETWORK_ID}

      # BppCallerURL is the ONIX BPP caller base URL used for outbound on_* callbacks.
      BPP_CALLER_URL: http://onix-bpp:8082/bpp/caller
      CDS_PUBLISH_URL: http://onix-catalog-publish:8085/catalog/publish
      # Where onix-catalog-publish actually wrote the index/catalog files --
      # same value as its own catalogBaseURL (config/catalog-publish.yaml).
      # Deliberately a SEPARATE var from CATALOG_BASE_URL (unset locally):
      # that one also feeds PublishedBppURI()'s bppUri fallback, and locally
      # the static file server (catalog-files) is not the same host as the
      # real BPP receiver (onix-bpp), unlike in the cloud where one domain
      # serves both -- setting CATALOG_BASE_URL here would silently break
      # the bppUri stamped on every published catalog.
      CATALOG_FILES_BASE_URL: http://catalog-files

      # Default settlement terms for offers published without their own, and
      # this BPP's payout account (see .env.example).
      SETTLEMENT_BASIS: ${SETTLEMENT_BASIS:-AFTER_DELIVERY}
      SETTLEMENT_WINDOW: ${SETTLEMENT_WINDOW:-P1D}
      COMMISSION_TYPE: ${COMMISSION_TYPE:-PERCENT}
      COMMISSION_VALUE: ${COMMISSION_VALUE:-3}
      COMMISSION_APPLIES_TO: ${COMMISSION_APPLIES_TO:-ITEM_TOTAL}
      SETTLEMENT_BANK_CODE: ${BPP_SETTLEMENT_BANK_CODE:-BCA}
      SETTLEMENT_ACCOUNT_NUMBER: ${BPP_SETTLEMENT_ACCOUNT_NUMBER:-8730000000001}
      SETTLEMENT_ACCOUNT_NAME: ${BPP_SETTLEMENT_ACCOUNT_NAME:-}
      RECONCILE_WAIT_FOR_SETTLEMENT_WINDOW: ${RECONCILE_WAIT_FOR_SETTLEMENT_WINDOW:-true}

      # Same keypair as config/local-simple-bpp.yaml's keyManager — one registered identity.
      BPP_PRIVATE_KEY: ${BPP_PRIVATE_KEY}
      BPP_KEY_ID: ${BPP_KEY_ID}

      # Seller login (see zitadel service above). ZITADEL_ISSUER must match
      # Zitadel's configured ZITADEL_EXTERNALDOMAIN/PORT exactly -- it's both
      # the "iss" claim on tokens AND the Host header Zitadel's own
      # host-header-based instance resolution requires. ZITADEL_INTERNAL_URL
      # is the address actually dialed (the docker-network hostname) --
      # internal/auth.NewVerifier sends that request with a Host header of
      # ZITADEL_ISSUER's host, so instance resolution still succeeds even
      # though the two addresses differ.
      ZITADEL_ISSUER: http://localhost:8090
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      LANDING_PAGE_ORIGIN: http://localhost:3002
    ports:
      - "8080:8080"
    networks:
      - beckn

  # ─── BAP Application ──────────────────────────────────────────────────────
  bap:
    build:
      context: ./bap-application
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bap:
        condition: service_completed_successfully
      onix-bap:
        condition: service_started
      zitadel:
        condition: service_healthy
    environment:
      APP_PORT: "8083"
      APP_ENV: development
      LOG_LEVEL: info

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bap
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable

      # bap's registered subscriber identity. Sourced from the git-ignored
      # root .env file.
      BAP_ID: ${BAP_ID}
      # Bare registered Subscriber URL, not the internal /bap/receiver path —
      # goes straight into context.bapUri (matches remiges-trade).
      BAP_URI: http://onix-bap:8081/bap/receiver
      NETWORK_ID: ${NETWORK_ID}

      # BPP identity placed in context.bppId / context.bppUri -- same ${BPP_ID}
      # as the bpp service above, so the two can never drift apart.
      BPP_ID: ${BPP_ID}
      BPP_URI: http://onix-bpp:8082/bpp/receiver

      # ADAPTER_URL is the ONIX BAP adapter the BAP actually POSTs to.
      ADAPTER_URL: http://onix-bap:8081/bap/caller

      # This BAP's payout account for the commission sellers pay it
      # (see .env.example).
      SETTLEMENT_BANK_CODE: ${BAP_SETTLEMENT_BANK_CODE:-MANDIRI}
      SETTLEMENT_ACCOUNT_NUMBER: ${BAP_SETTLEMENT_ACCOUNT_NUMBER:-1370000000001}
      SETTLEMENT_ACCOUNT_NAME: ${BAP_SETTLEMENT_ACCOUNT_NAME:-}
      RECONCILE_WAIT_FOR_SETTLEMENT_WINDOW: ${RECONCILE_WAIT_FOR_SETTLEMENT_WINDOW:-true}

      # Selects which of the two discover implementations the browser's
      # GET /api/v1/discover actually runs -- exactly one at a time (see
      # internal/config.Config.DiscoverMethod):
      #   GET  = DiscoverSync, direct to discovery-service, bypassing
      #          onix-bap entirely (fast, reliable, but not the spec's
      #          real adapter-mediated topology).
      #   POST = Discover, the real async Beckn contract via onix-bap
      #          (same path every other action uses) -- requires
      #          discovery-service's identity to be resolvable through
      #          onix-bap's network registry, which it currently is not
      #          (see discovery-service/CONTEXT.md D20/D21); leave this on
      #          GET until that's actually registered, or it'll time out.
      DISCOVER_METHOD: ${DISCOVER_METHOD:-GET}

      # discovery-service's own /discover endpoint, called DIRECTLY --
      # bypassing onix-bap entirely. Used only when DISCOVER_METHOD=GET.
      CDS_DISCOVER_URL: ${CDS_DISCOVER_URL}

      # Same keypair as config/local-simple-bap.yaml's keyManager — one registered identity.
      BAP_PRIVATE_KEY: ${BAP_PRIVATE_KEY}
      BAP_KEY_ID: ${BAP_KEY_ID}

      # Buyer login (see zitadel service above and bpp's ZITADEL_ISSUER
      # comment for the full rationale) -- reuses the same Zitadel app that
      # gates the seller flow. Unlike bpp, this is optional/best-effort: bap
      # still serves traffic if Zitadel is unreachable, just without buyer
      # identity resolution (see internal/auth.OptionalAuth).
      ZITADEL_ISSUER: http://localhost:8090
      ZITADEL_INTERNAL_URL: http://zitadel:8080

      # QR packet checkout (internal/qrsvc) and the /qr-admin packet console.
      # qr-service runs from the ion-qr-code repo (its own compose, port
      # 8088 on the host); the defaults match that compose's dev keys.
      # Leave QR_SERVICE_URL empty to switch the QR routes off.
      QR_SERVICE_URL: ${QR_SERVICE_URL-http://host.docker.internal:8088}
      QR_SERVICE_KEY: ${QR_SERVICE_KEY:-dev-service-key-bap-application-0001}
      # Bearer token for qr-service's admin APIs; blank forwards the
      # logged-in user's own token (needs qr-service's ion_admin role).
      QR_ADMIN_TOKEN: ${QR_ADMIN_TOKEN-dev-admin-token}
      QR_ALLOW_UNLOCATED_MERCHANTS: ${QR_ALLOW_UNLOCATED_MERCHANTS:-true}
      # Scan simulator demo scenarios (fast checkout / several merchants /
      # changed price) played by the BAP itself, no Beckn calls. Local dev only;
      # the BAP default is off.
      QR_DEMO_ENABLED: ${QR_DEMO_ENABLED:-true}
      # QR resolve and the coverage check run the Beckn discover -> on_discover
      # exchange through onix-bap (POST). GET is the adapter-less shortcut,
      # for local testing only.
      QR_DISCOVER_METHOD: ${QR_DISCOVER_METHOD:-POST}
      # qr-service asks this BAP for merchant coverage (it has no Beckn
      # identity of its own): its COVERAGE_BAP_KEY must equal this.
      QR_COVERAGE_KEY: ${QR_COVERAGE_KEY:-dev-service-key-qr-service-0001}
    extra_hosts:
      # Lets QR_SERVICE_URL reach qr-service published on the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:8083"
    networks:
      - beckn

  # ─── BAP Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./bap-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bap
    environment:
      BAP_URL: http://bap:8083
      # 127.0.0.11 is Docker's embedded DNS, resolves compose service names.
      NGINX_RESOLVER: "127.0.0.11"
      BPP_ADMIN_URL: ${VITE_BPP_ADMIN_URL}
      # Read by the BROWSER (see src/auth.js) to redirect back to login on
      # missing/expired sessions -- must be host-published, not internal.
      LANDING_PAGE_URL: http://localhost:3002
    ports:
      - "3000:80"
    networks:
      - beckn

  # ─── BPP Frontend (Admin Dashboard) ─────────────────────────────────────
  bpp-frontend:
    build:
      context: ./bpp-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bpp
    environment:
      BPP_URL: http://bpp:8080
      NGINX_RESOLVER: "127.0.0.11"
      BAP_URL: ${VITE_BAP_URL}
      # Read by the BROWSER (see src/auth.js) to redirect back to login on
      # missing/expired sessions -- must be host-published, not internal.
      LANDING_PAGE_URL: http://localhost:3002
    ports:
      - "3001:80"
    networks:
      - beckn

  # ─── Landing Page (buyer/seller entry point) ────────────────────────────
  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BAP_URL: http://localhost:3000
      BPP_URL: http://localhost:3001
      # All three below are read by the BROWSER (landing-page is a client-side
      # SPA), so these must be host-published, browser-reachable addresses,
      # not internal docker-network hostnames.
      BPP_API_URL: http://localhost:8080
      ZITADEL_ISSUER: http://localhost:8090
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
    ports:
      - "3002:80"
    networks:
      - beckn

  # ─── ION Experience Demos ───────────────────────────────────────────────
  # Standalone front page for the whole app -- pure static HTML/CSS/JS, no
  # build step. Fully independent from landing-page above: it never touches
  # login/tokens itself, it just links out ("Launch partner demo") to
  # landing-page's own URL, which handles the real Zitadel flow unchanged.
  ion-landing-page:
    build:
      context: ./ion-landing-page
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LANDING_PAGE_URL: http://localhost:3002
    ports:
      - "3003:80"
    networks:
      - beckn

volumes:
  postgres_data:

networks:
  beckn:
    driver: bridge
