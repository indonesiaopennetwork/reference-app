server {
    listen 80;

    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    # Hashed build assets (index-<hash>.js/css) are immutable -- the hash
    # changes whenever the content does, so they can be cached hard.
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must NEVER be cached. It is the file that names which
    # hashed asset to load, so a stale copy pins the browser to a previous
    # build's JS and the deploy silently has no effect -- a rebuilt
    # container serves new code that nobody sees. nginx sends no
    # Cache-Control of its own here, which leaves browsers free to cache
    # index.html heuristically; this makes the rule explicit.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        set $upstream "${BPP_URL}";
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
