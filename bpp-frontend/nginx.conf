server {
    listen 80;

    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream "${BPP_URL}";
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Matches bap-frontend's identical setting -- see its nginx.conf
        # comment: any synchronous action going through onix-bpp can hit
        # the same cold-Extended-Schema-cache delay, and this proxy's own
        # timeout would cut the connection first regardless of timeouts
        # further down the chain.
        proxy_read_timeout 90s;
    }
}
