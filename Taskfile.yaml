version: '3'

# Loaded automatically if present; DEDI_PUBLIC_KEY / DEDI_PRIVATE_KEY are expected
# to already be set there (or exported another way) before running `task sign`.
dotenv: ['dedi-onboarding-files/.env.local']

vars:
  SIGNER: './dedi-onboarding-files/dedi-file-signer'
  REGISTRY_FILE: 'dedi-onboarding-files/ion-scratch-registry.json'
  INDEX_FILE: 'dedi-onboarding-files/dedi.index.json'
  NEXT_UPDATE_TTL_SECONDS: 31536000

tasks:
  sign-dedi-files:
    desc: >-
      Re-sign the DeDi registry file, update its digest in the index file,
      then re-sign the index file. Override paths with REGISTRY_FILE=...
      INDEX_FILE=...
    cmds:
      - task: _ensure-future-next-update
        vars: {TARGET_FILE: '{{.REGISTRY_FILE}}'}
      - '{{.SIGNER}} "{{.REGISTRY_FILE}}"'
      - |
        set -euo pipefail
        REGISTRY_FILE="{{.REGISTRY_FILE}}"
        INDEX_FILE="{{.INDEX_FILE}}"
        REGISTRY_NAME=$(jq -r '.registry.name // empty' "$REGISTRY_FILE")
        REGISTRY_URL=$(jq -r '.source_url // empty' "$REGISTRY_FILE")
        DIGEST="sha-256:$(sha256sum "$REGISTRY_FILE" | cut -d' ' -f1)"
        TMP=$(mktemp)
        jq --arg name "$REGISTRY_NAME" --arg url "$REGISTRY_URL" --arg digest "$DIGEST" '
          (.files[] | select(.registry == $name or .url == $url) | .digest) = $digest
        ' "$INDEX_FILE" > "$TMP"
        if ! grep -q "$DIGEST" "$TMP"; then
          echo "error: no files[] entry in $INDEX_FILE matched registry=\"$REGISTRY_NAME\" or url=\"$REGISTRY_URL\"" >&2
          rm -f "$TMP"
          exit 1
        fi
        mv "$TMP" "$INDEX_FILE"
        echo "updated digest in $INDEX_FILE to $DIGEST"
      - task: _ensure-future-next-update
        vars: {TARGET_FILE: '{{.INDEX_FILE}}'}
      - '{{.SIGNER}} "{{.INDEX_FILE}}"'

  deploy-dedi-files:
    desc: >-
      Upload the DeDi index and registry files to the dedi-static GCS
      bucket. Override paths with REGISTRY_FILE=... INDEX_FILE=....
    vars:
      DEDI_BUCKET:
        sh: cd terraform && terraform output -raw dedi_static_bucket
    cmds:
      - gsutil cp "{{.INDEX_FILE}}" "gs://{{.DEDI_BUCKET}}/.well-known/dedi.index.json"
      - gsutil cp "{{.REGISTRY_FILE}}" "gs://{{.DEDI_BUCKET}}/dedi/ion-scratch-registry.json"

  deploy-ion-landing-page-files:
    desc: >-
      Upload ion-landing-page's static index.html to its GCS bucket.
    vars:
      ION_LANDING_PAGE_BUCKET:
        sh: cd terraform && terraform output -raw ion_landing_page_bucket
    cmds:
      - gsutil cp ion-landing-page/index.html "gs://{{.ION_LANDING_PAGE_BUCKET}}/index.html"

  _ensure-future-next-update:
    internal: true
    cmds:
      - |
        set -euo pipefail
        FILE="{{.TARGET_FILE}}"
        NOW=$(date -u +%s)
        CURRENT=$(jq -r '.next_update // empty' "$FILE")
        if [ -z "$CURRENT" ]; then
          echo "no next_update field in $FILE, skipping check"
        else
          CURRENT_EPOCH=$(date -u -d "$CURRENT" +%s)
          if [ "$CURRENT_EPOCH" -le "$NOW" ]; then
            NEW_VALUE=$(date -u -d "@$((NOW + {{.NEXT_UPDATE_TTL_SECONDS}}))" +%Y-%m-%dT%H:%M:%SZ)
            TMP=$(mktemp)
            jq --arg v "$NEW_VALUE" '.next_update = $v' "$FILE" > "$TMP" && mv "$TMP" "$FILE"
            echo "next_update in $FILE was in the past ($CURRENT); updated to $NEW_VALUE"
          fi
        fi

  # ───────────────────────────────────────────────────────────────────────
  # Local development — mirrors INFRA_SETUP.md §1b-1c. Requires a filled-in
  # .env (copied from .env.example), plus envsubst, curl, and jq.
  # ───────────────────────────────────────────────────────────────────────

  local:up:
    desc: >-
      Bring up the full stack locally with Docker Compose: render the onix
      configs from .env, start Postgres + Zitadel, run the Zitadel setup
      script, then build and start everything else (the migrate-bap/
      migrate-bpp compose jobs apply the DB schema). Safe to re-run.
    preconditions:
      - sh: test -f .env
        msg: ".env not found -- copy .env.example to .env and fill in your keys first (INFRA_SETUP.md §1b)."
    cmds:
      - ./scripts/render-onix-config.sh
      - docker compose up -d --wait postgres zitadel
      - ./scripts/setup-zitadel.sh
      - docker compose up -d --build

  local:down:
    desc: Stop and remove the local Docker Compose stack (volumes are kept).
    cmds:
      - docker compose down

  specs:sync:
    desc: >-
      Copy the ION network extension spec (docs/specs/reconcile.yaml) into the
      onix-bap / onix-bpp image templates, where the cloud adapters load it
      from /app/config (local compose mounts docs/specs directly). Run after
      editing the spec, before redeploying the adapters.
    cmds:
      - cp docs/specs/reconcile.yaml onix-bap/templates/reconcile.yaml
      - cp docs/specs/reconcile.yaml onix-bpp/templates/reconcile.yaml

  # ───────────────────────────────────────────────────────────────────────
  # Fresh deploy — mirrors README.md "Deploy to your fresh GCP project"
  # steps 0-9. Run in order. Steps 0/2/4 aren't here (a one-time backend.tf
  # text edit, a tfvars file, and real secret key material — nothing to
  # script safely). deploy:state-bucket and deploy:build-all need explicit
  # PROJECT_ID=/REGION= since no Terraform state exists yet to derive them
  # from; everything after that self-derives from `terraform output`.
  # ───────────────────────────────────────────────────────────────────────

  deploy:state-bucket:
    desc: "Step 1: create the GCS bucket Terraform stores state in. Usage: task deploy:state-bucket PROJECT_ID=... REGION=..."
    requires:
      vars: [PROJECT_ID, REGION]
    cmds:
      - gcloud storage buckets create gs://{{.PROJECT_ID}}-tfstate --project={{.PROJECT_ID}} --location={{.REGION}} --uniform-bucket-level-access
      - gcloud storage buckets update gs://{{.PROJECT_ID}}-tfstate --versioning

  deploy:bootstrap-apis:
    desc: "Step 3: bootstrap APIs, Artifact Registry, and empty secret containers."
    dir: terraform
    cmds:
      - terraform init
      - terraform plan -target=google_project_service.apis -target=google_artifact_registry_repository.repo -target=google_secret_manager_secret.this -out=bootstrap1.tfplan
      - terraform apply bootstrap1.tfplan

  deploy:seed-secrets:
    desc: >-
      Step 4: seed the 14 externally-sourced secrets from a local file (see
      scripts/seed-secrets.env.example). Usage: task deploy:seed-secrets
      PROJECT_ID=... [FILE=...]
    vars:
      FILE: '{{.FILE | default "scripts/seed-secrets.env"}}'
    requires:
      vars: [PROJECT_ID]
    cmds:
      - PROJECT_ID={{.PROJECT_ID}} ./scripts/seed-secrets.sh {{.FILE}}

  deploy:build-all:
    desc: "Step 5: build and push every image. Usage: task deploy:build-all PROJECT_ID=... REGION=..."
    requires:
      vars: [PROJECT_ID, REGION]
    cmds:
      - PROJECT_ID={{.PROJECT_ID}} REGION={{.REGION}} ./scripts/build-and-push.sh

  deploy:infra:
    desc: "Step 6: create the network, Cloud SQL, and Redis (slow — budget 5-10 min)."
    dir: terraform
    cmds:
      - terraform plan -target=google_compute_network.vpc -target=google_compute_subnetwork.subnet -target=google_compute_global_address.psa_range -target=google_service_networking_connection.psa -target=google_sql_database_instance.postgres -target=google_redis_instance.redis -target=google_compute_subnetwork_iam_member.network_user -target=google_project_iam_member.cloud_sql_client -out=bootstrap2.tfplan
      - terraform apply bootstrap2.tfplan

  deploy:zitadel-infra:
    desc: "Step 6b.1: apply Zitadel — service, domain mapping, and IAM invoker binding together (the binding is easy to miss and Zitadel is unreachable without it)."
    dir: terraform
    cmds:
      - terraform plan -target=google_cloud_run_v2_service.zitadel -target=google_cloud_run_domain_mapping.zitadel -target='google_cloud_run_v2_service_iam_member.public_invoker["zitadel"]' -out=zitadel.tfplan
      - terraform apply zitadel.tfplan

  deploy:wait-zitadel-dns:
    desc: >-
      Step 6b.2: poll Zitadel's custom domain until DNS + the managed TLS
      cert are ready (can take up to ~60 min). Prints the DNS records to
      create right away so there's something to act on immediately.
    dir: terraform
    vars:
      ZITADEL_URL:
        sh: terraform output -raw zitadel_domain_url
    cmds:
      - |
        set -euo pipefail
        echo "Create these DNS records now (if you haven't already):"
        terraform output zitadel_domain_dns_records
        echo ""
        echo "Waiting for {{.ZITADEL_URL}}/.well-known/openid-configuration to become reachable (up to ~60 min)..."
        for i in $(seq 1 120); do
          if curl -sf "{{.ZITADEL_URL}}/.well-known/openid-configuration" >/dev/null 2>&1; then
            echo "Zitadel domain is ready."
            exit 0
          fi
          if [ $((i % 10)) -eq 0 ]; then
            echo "Still waiting... ($((i * 30))s elapsed)"
          fi
          sleep 30
        done
        echo "ERROR: {{.ZITADEL_URL}} never became reachable after ~60 min. Check DNS propagation and the managed SSL cert status, then re-run: task deploy:wait-zitadel-dns" >&2
        exit 1

  deploy:setup-zitadel:
    desc: >-
      Step 6b.3: run scripts/setup-zitadel-cloud.sh and automatically patch
      the resulting zitadel_client_id into terraform/terraform.tfvars (no
      manual copy-paste), then re-apply so landing-page picks it up.
    vars:
      PROJECT_ID:
        sh: cd terraform && terraform output -raw project_id
    cmds:
      - |
        set -euo pipefail
        OUTPUT="$(PROJECT_ID={{.PROJECT_ID}} ./scripts/setup-zitadel-cloud.sh)"
        echo "$OUTPUT"
        CLIENT_ID="$(echo "$OUTPUT" | grep -oE 'zitadel_client_id = "[^"]*"' | tail -n1)"
        if [ -z "$CLIENT_ID" ]; then
          echo "ERROR: could not find a zitadel_client_id line in setup-zitadel-cloud.sh's output." >&2
          exit 1
        fi
        if grep -q '^zitadel_client_id' terraform/terraform.tfvars 2>/dev/null; then
          sed -i.bak "s|^zitadel_client_id.*|$CLIENT_ID|" terraform/terraform.tfvars && rm -f terraform/terraform.tfvars.bak
        else
          printf '\n%s\n' "$CLIENT_ID" >> terraform/terraform.tfvars
        fi
        echo "Patched terraform/terraform.tfvars with: $CLIENT_ID"
      - cd terraform && terraform plan -target=google_cloud_run_v2_service.landing_page -out=zitadel-client.tfplan && terraform apply zitadel-client.tfplan

  deploy:full-apply-and-migrate:
    desc: >-
      Steps 7-9 chained: full apply (bap/bpp are expected to fail here — no
      DB schema yet), run both migration jobs, then full apply again.
    cmds:
      - task: deploy:full-apply
        ignore_error: true
      - task: deploy:migrate
      - task: deploy:full-apply

  deploy:dedi-bucket:
    desc: >-
      Create the DeDi static-file bucket and its IAM bindings only -- unlike
      dedi-static-server, the bucket has no dependency on bap/bpp/onix-bap/
      onix-bpp, so this can run as early as right after bootstrap-apis.
    dir: terraform
    cmds:
      - terraform plan -target=google_storage_bucket.dedi_static -target=google_storage_bucket_iam_member.dedi_static_public_read -target=google_storage_bucket_iam_member.dedi_static_writer -out=dedi-bucket.tfplan
      - terraform apply dedi-bucket.tfplan

  deploy:dedi-server:
    desc: >-
      Create dedi-static-server and its two custom domain mappings. Run
      AFTER deploy:full-apply-and-migrate has succeeded -- its config
      references bap/bpp/onix-bap/onix-bpp's live Cloud Run URLs directly,
      so those must already exist. (The bucket itself is separate --
      see deploy:dedi-bucket -- and can run much earlier.)
    dir: terraform
    cmds:
      - terraform plan -target=google_cloud_run_v2_service.dedi_static -target=google_cloud_run_v2_service_iam_member.dedi_static_public_invoker -target=google_cloud_run_domain_mapping.dedi_apex -target=google_cloud_run_domain_mapping.dedi_www -out=dedi-server.tfplan
      - terraform apply dedi-server.tfplan

  deploy:ion-landing-page-bucket:
    desc: >-
      Create the ion-landing-page static bucket and its public-read IAM
      binding only -- no dependency on any other service, can run any time.
    dir: terraform
    cmds:
      - terraform plan -target=google_storage_bucket.ion_landing_page_static -target=google_storage_bucket_iam_member.ion_landing_page_public_read -out=ion-landing-page-bucket.tfplan
      - terraform apply ion-landing-page-bucket.tfplan

  deploy:ion-landing-page-server:
    desc: >-
      Create the ion-landing-page Cloud Run service, its public invoker
      binding, and its domain mapping. Run AFTER deploy:ion-landing-page-bucket
      and task deploy-ion-landing-page-files have succeeded.
    dir: terraform
    cmds:
      - terraform plan -target=google_cloud_run_v2_service.ion_landing_page -target=google_cloud_run_v2_service_iam_member.ion_landing_page_public_invoker -target=google_cloud_run_domain_mapping.ion_landing_page -out=ion-landing-page-server.tfplan
      - terraform apply ion-landing-page-server.tfplan

  deploy:phase1:
    desc: >-
      Minimum-steps deployment, part 1: runs bootstrap through bringing up
      Zitadel, then prints the DNS record to create and stops -- that's the
      one dependency nothing here can automate. Once you've created and
      verified it, continue with deploy:phase2. Requires
      deploy:state-bucket to have already run once, and
      terraform/terraform.tfvars + scripts/seed-secrets.env +
      dedi-onboarding-files/.env.local (plus a `task sign-dedi-files` run)
      to already be filled in / done. Usage: task deploy:phase1
      PROJECT_ID=... REGION=...
    requires:
      vars: [PROJECT_ID, REGION]
    cmds:
      - task: deploy:bootstrap-apis
      - task: deploy:dedi-bucket
      - task: deploy-dedi-files
      - task: deploy:seed-secrets
        vars: {PROJECT_ID: '{{.PROJECT_ID}}'}
      - task: deploy:build-all
        vars: {PROJECT_ID: '{{.PROJECT_ID}}', REGION: '{{.REGION}}'}
      - task: deploy:infra
      - task: deploy:zitadel-infra
      - |
        cd terraform
        echo ""
        echo "phase1 done. Create this DNS record now, then once it's verified, run: task deploy:phase2"
        terraform output zitadel_domain_dns_records

  deploy:phase2:
    desc: >-
      Minimum-steps deployment, part 2: run once Zitadel's DNS record from
      deploy:phase1 is created and verified. Confirms Zitadel is actually
      reachable, sets up its OIDC client, finishes the apply/migrate cycle,
      and brings up dedi-static-server (making the discovery chain publicly
      live).
    cmds:
      - task: deploy:wait-zitadel-dns
      - task: deploy:setup-zitadel
      - task: deploy:full-apply-and-migrate
      - task: deploy:dedi-server
      - |
        cd terraform
        echo ""
        echo "Deployment complete. Also create these DNS records at your registrar (not required for the deployment itself, but these URLs won't resolve without them):"
        terraform output bap_domain_dns_records
        terraform output bap_frontend_domain_dns_records
        terraform output bpp_frontend_domain_dns_records
        terraform output landing_page_domain_dns_records
        terraform output bpp_domain_dns_records
        terraform output bpp_domain_www_dns_records

  deploy:full-apply:
    desc: "Steps 7 & 9: full terraform apply. Run this task twice — the first run is expected to fail on bap/bpp (no DB schema yet); run deploy:migrate in between."
    dir: terraform
    cmds:
      - terraform plan -out=full.tfplan
      - terraform apply full.tfplan

  deploy:migrate:
    desc: "Step 8: run both migration jobs (self-derives PROJECT_ID/REGION — by this point terraform apply has run)."
    vars:
      PROJECT_ID:
        sh: cd terraform && terraform output -raw project_id
      REGION:
        sh: cd terraform && terraform output -raw region
    cmds:
      - gcloud run jobs execute migrate-bap --project={{.PROJECT_ID}} --region={{.REGION}} --wait
      - gcloud run jobs execute migrate-bpp --project={{.PROJECT_ID}} --region={{.REGION}} --wait

  # ───────────────────────────────────────────────────────────────────────
  # Per-service redeploy — each rebuilds, pushes, and forces a new revision
  # via `gcloud run services update --image=...` directly, bypassing
  # Terraform's `lifecycle { ignore_changes = [image] }` on purpose (a plain
  # `terraform apply`, even with a new image_tag, will NOT redeploy — see
  # README.md "Code change in any service"). Only the one service named
  # rebuilds; every other service is untouched.
  #
  # All of them delegate to _redeploy-service, which self-derives
  # PROJECT_ID/REGION/REGISTRY/TAG from `terraform output`/git — lazily,
  # only when a redeploy task actually runs, so this has no effect on
  # unrelated tasks (like sign-dedi-files) or on running before the first
  # `terraform apply`.
  # ───────────────────────────────────────────────────────────────────────

  _redeploy-service:
    internal: true
    vars:
      PROJECT_ID:
        sh: cd terraform && terraform output -raw project_id
      REGION:
        sh: cd terraform && terraform output -raw region
      REGISTRY:
        sh: cd terraform && terraform output -raw artifact_registry_repo
      TAG:
        sh: git rev-parse --short HEAD
    dir: '{{.CONTEXT_DIR}}'
    cmds:
      - docker build -t {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}} -f {{.DOCKERFILE | default "Dockerfile"}} .
      - docker push {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}
      - gcloud run services update {{.SERVICE}} --project={{.PROJECT_ID}} --region={{.REGION}} --container={{.CONTAINER}} --image={{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}

  _redeploy-job:
    internal: true
    vars:
      PROJECT_ID:
        sh: cd terraform && terraform output -raw project_id
      REGION:
        sh: cd terraform && terraform output -raw region
      REGISTRY:
        sh: cd terraform && terraform output -raw artifact_registry_repo
      TAG:
        sh: git rev-parse --short HEAD
    dir: '{{.CONTEXT_DIR}}'
    cmds:
      - docker build -t {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}} -f {{.DOCKERFILE}} .
      - docker push {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}
      - gcloud run jobs update {{.JOB}} --project={{.PROJECT_ID}} --region={{.REGION}} --image={{.REGISTRY}}/{{.IMAGE}}:{{.TAG}}
      - gcloud run jobs execute {{.JOB}} --project={{.PROJECT_ID}} --region={{.REGION}} --wait

  redeploy:bap:
    desc: Rebuild, push, and redeploy ONLY bap.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: bap-application, IMAGE: bap-application, SERVICE: bap, CONTAINER: bap}

  redeploy:bpp:
    desc: Rebuild, push, and redeploy ONLY bpp.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: bpp-application, IMAGE: bpp-application, SERVICE: bpp, CONTAINER: bpp}

  redeploy:bap-frontend:
    desc: Rebuild, push, and redeploy ONLY bap-frontend.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: bap-frontend, IMAGE: bap-frontend, SERVICE: bap-frontend, CONTAINER: bap-frontend}

  redeploy:bpp-frontend:
    desc: Rebuild, push, and redeploy ONLY bpp-frontend.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: bpp-frontend, IMAGE: bpp-frontend, SERVICE: bpp-frontend, CONTAINER: bpp-frontend}

  redeploy:onix-bap:
    desc: Rebuild, push, and redeploy ONLY onix-bap (Cloud Run service name is beckn-onix-bap).
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: onix-bap, IMAGE: onix-bap, SERVICE: beckn-onix-bap, CONTAINER: onix-bap}

  redeploy:onix-bpp:
    desc: Rebuild, push, and redeploy ONLY onix-bpp (Cloud Run service name is beckn-onix-bpp).
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: onix-bpp, IMAGE: onix-bpp, SERVICE: beckn-onix-bpp, CONTAINER: onix-bpp}

  redeploy:onix-catalog-publish:
    desc: Rebuild, push, and redeploy ONLY onix-catalog-publish.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: onix-catalog-publish, IMAGE: onix-catalog-publish, SERVICE: onix-catalog-publish, CONTAINER: onix-catalog-publish}

  redeploy:dedi-static-server:
    desc: Rebuild, push, and redeploy ONLY dedi-static-server.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: dedi-static-server, IMAGE: dedi-static-server, SERVICE: dedi-static-server, CONTAINER: dedi-static-server}

  redeploy:landing-page:
    desc: Rebuild, push, and redeploy ONLY landing-page.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: landing-page, IMAGE: landing-page, SERVICE: landing-page, CONTAINER: landing-page}

  redeploy:ion-landing-page:
    desc: >-
      Rebuild, push, and redeploy ONLY the ion-landing-page nginx image.
      Builds from Dockerfile.cloud (proxy_pass to the GCS bucket's public
      URL) -- NOT the plain Dockerfile used for local docker-compose.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: ion-landing-page, IMAGE: ion-landing-page, SERVICE: ion-landing-page, CONTAINER: ion-landing-page, DOCKERFILE: Dockerfile.cloud}

  redeploy:discovery-service:
    desc: Rebuild, push, and redeploy ONLY discovery-service.
    cmds:
      - task: _redeploy-service
        vars: {CONTEXT_DIR: discovery-service, IMAGE: discovery-service, SERVICE: discovery-service, CONTAINER: discovery-service}

  redeploy:migrate-bap:
    desc: Rebuild, push, update, and run the bap migration job.
    cmds:
      - task: _redeploy-job
        vars: {CONTEXT_DIR: bap-application, IMAGE: bap-application-migrate, DOCKERFILE: Dockerfile.migrate, JOB: migrate-bap}

  redeploy:migrate-bpp:
    desc: Rebuild, push, update, and run the bpp migration job.
    cmds:
      - task: _redeploy-job
        vars: {CONTEXT_DIR: bpp-application, IMAGE: bpp-application-migrate, DOCKERFILE: Dockerfile.migrate, JOB: migrate-bpp}

  redeploy:all:
    desc: Rebuild and redeploy every service (not the two migrate jobs — those only run when a migration actually changed).
    cmds:
      - task: redeploy:bap
      - task: redeploy:bpp
      - task: redeploy:bap-frontend
      - task: redeploy:bpp-frontend
      - task: redeploy:onix-bap
      - task: redeploy:onix-bpp
      - task: redeploy:onix-catalog-publish
      - task: redeploy:dedi-static-server
      - task: redeploy:landing-page
      - task: redeploy:ion-landing-page
      - task: redeploy:discovery-service
