server {
    listen 80;

    # Serve the React SPA — all unknown paths (e.g. /callback, the OIDC
    # redirect target) fall back to index.html; App.jsx handles routing
    # client-side based on window.location.pathname.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
